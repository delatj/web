<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Panel de Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #4a5568;
        }
        #display {
            font-size: 50px;
            font-weight: 800;
            margin: 15px 0 25px 0;
            color: #2d3748;
            background: #edf2f7;
            padding: 15px;
            border-radius: 12px;
            letter-spacing: 2px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease, background 0.2s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-5 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .btn-10 { background: linear-gradient(135deg, #b19cd9 0%, #9b59b6 100%); }
        
        /* Botón de Parar General */
        .btn-reset { background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%); }
        
        .btn-deporte { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #1a202c; }
        .btn-estudio { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: #1a202c; }
        
        .divider {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control de Tiempo</h1>
        <div id="display">00:00</div>

        <!-- Botones de Temporizador y Parada -->
        <button class="btn btn-5" onclick="iniciarTemporizador(5)">⏱️ 5 Minutos</button>
        <button class="btn btn-10" onclick="iniciarTemporizador(10)">⏱️ 10 Minutos</button>
        <button class="btn btn-reset" onclick="detenerTodo()">⏹️ Parar / Reiniciar</button>

        <hr class="divider">

        <!-- Botones de Enlaces directos -->
        <button class="btn btn-deporte" onclick="abrirEnlace('https://www.youtube.com/watch?v=CpA7BKhxoPU&list=RDCpA7BKhxoPU&start_radio=1')">🏋️ Deporte</button>
        <button class="btn btn-estudio" onclick="abrirEnlace('https://www.youtube.com/watch?v=HQ40ksM2Vc0&list=RDHQ40ksM2Vc0&start_radio=1&t=3926s')">📚 Estudiar</button>
    </div>

    <script>
        let temporizador = null;
        let pitidoInterval = null;
        let audioCtx = null;
        let tiempoFin = null;

        function iniciarMinutos(minutos) {
            detenerTodo();

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            tiempoFin = Date.now() + (minutos * 60 * 1000);
            actualizarPantalla();
            temporizador = setInterval(actualizarPantalla, 500);
        }

        function actualizarPantalla() {
            if (!tiempoFin) return;

            const msRestantes = tiempoFin - Date.now();
            const segundosRestantes = Math.ceil(msRestantes / 1000);

            if (segundosRestantes <= 0) {
                clearInterval(temporizador);
                temporizador = null;
                tiempoFin = null;
                iniciarPitido3Minutos();
            } else {
                let min = Math.floor(segundosRestantes / 60);
                let seg = segundosRestantes % 60;
                document.getElementById('display').textContent = 
                    `${min < 10 ? '0' : ''}${min}:${seg < 10 ? '0' : ''}${seg}`;
            }
        }

        function iniciarTemporizador(minutos) {
            iniciarMinutos(minutos);
        }

        // Función que genera un tono rápido individual
        function emiterTono(frecuencia, duracionMs, tiempoInicio) {
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            // Tipo 'square' (onda cuadrada) para el sonido sintético/electrónico de un reloj
            oscillator.type = 'square'; 
            oscillator.frequency.setValueAtTime(frecuencia, tiempoInicio);
            
            // Volumen ligeramente ajustado para no distorsionar por la frecuencia alta
            gainNode.gain.setValueAtTime(0.15, tiempoInicio);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(tiempoInicio);
            oscillator.stop(tiempoInicio + (duracionMs / 1000));
        }

        // Reproduce el patrón "bi-bit" característico de reloj digital
        function reproducirBeep() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const ahora = audioCtx.currentTime;
            const frecuenciaAguda = 2048; // Frecuencia típica (~2kHz) de los relojes digitales

            // Primer pitido cortito
            emiterTono(frecuenciaAguda, 80, ahora);
            // Segundo pitido cortito poco después
            emiterTono(frecuenciaAguda, 80, ahora + 0.12);
        }

        function iniciarPitido3Minutos() {
            document.getElementById('display').textContent = "¡TIEMPO!";
            
            reproducirBeep();
            let vecesPitido = 0;
            pitidoInterval = setInterval(() => {
                if (vecesPitido >= 180) {
                    detenerTodo();
                } else {
                    reproducirBeep();
                    vecesPitido++;
                }
            }, 1000);
        }

        function detenerTodo() {
            clearInterval(temporizador);
            clearInterval(pitidoInterval);
            temporizador = null;
            pitidoInterval = null;
            tiempoFin = null;
            document.getElementById('display').textContent = "00:00";
        }

        function abrirEnlace(url) {
            window.open(url, '_blank');
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && tiempoFin) {
                actualizarPantalla();
            }
        });
    </script>

</body>
</html>
