<style>

.pareja-tag:hover{background:#c7d2fe}

<script>
const $=id=>document.getElementById(id);
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyiOndS6GMYhgiSGLVAXUOOHhMKtBXqcLUeOppbNZIkrxU-HiMlgmhlYCj1xYZQG0io/exec";

sirena:{n:'Sirena',k:['sirena','alarma'],w:'sawtooth',f:[[0,500],[.5,900],[1,500]],d:1},
laser:{n:'Láser',k:['laser','disparo'],w:'square',f:[[0,1500],[.3,200]],d:.3},
tambor:{n:'Tambor',k:['tambor','golpe','bombo'],w:'sine',f:[[0,160],[.25,45]],d:.3},

const PAL=[['label','🏷️','Etiqueta'],['image','🖼️','Imagen por URL'],['img','🖼️','Botón: mostrar imagen'],['bg','🎨','Botón: cambiar fondo'],['sound','🔔','Botón: reproducir tono'],['url','🌐','Botón: abrir web']];
const PR=[{t:'Colores de pantalla',s:['Arrastra una Etiqueta al móvil y escribe tu nombre.','Arrastra dos botones "Cambiar fondo".','Cambia el texto de cada botón (ej.: "Azul", "Verde") y el color del propio botón.','En cada botón elige un color de pantalla distinto.','Cambia también el color de fondo de la aplicación.','Pulsa ▶️ Probar, comprueba que la pantalla cambia y pulsa ✅ Evaluar.']},
{t:'Mi foto y mis sonidos',s:['Arrastra una Etiqueta y escribe tu nombre.','Debajo, arrastra una Imagen por URL y pega la dirección de una foto (https://...).','Añade dos botones "Reproducir tono" y elige un sonido distinto en cada uno.','Pon a cada botón el nombre del sonido (ej.: "Campana", "Sirena") y cámbiale el color.','Cambia el color de fondo de la aplicación.','Pruébalo en ▶️ y pulsa ✅ Evaluar.']},

function tone(id){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=T[id],o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t.w;t.f.forEach(([x,f],i)=>i?o.frequency.linearRampToValueAtTime(f,n+x):o.frequency.setValueAtTime(f,n));g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+t.d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+t.d)}catch(e){}}
function mk(k){const id='e'+Date.now()+Math.random().toString(36).slice(2,5);
 if(k==='label')return{id,t:'label',text:'Etiqueta',color:'#1e293b'};
 if(k==='image')return{id,t:'image',src:''};
 return{id,t:'button',text:'Botón',color:'#4f46e5',act:k,param:k==='bg'?'#cbd5e1':k==='sound'?'beep':''}}
function add(k,i){const e=mk(k),a=A().els;if(i==null)a.push(e);else a.splice(i,0,e);sel=e.id;if(mode!=='edit'){mode='edit';rb=null}render()}
function updateParejaDisplay(){
 const box=$('pareja-txt');
 if(!box) return;
 const a1=(S.al1_nom+' '+S.al1_ape).trim();
 const a2=(S.al2_nom+' '+S.al2_ape).trim();
 if(a1||a2){
  if(a1.toLowerCase()===a2.toLowerCase()||!a2){
   box.textContent=a1;
  }else{
   box.textContent=a1+' | '+a2;
  }
 }else{
  box.textContent='Sin datos';
 }
}
function render(){rBar();rScr();rPr();$('me').classList.toggle('on',mode==='edit');$('mt').classList.toggle('on',mode==='test');checkSendLockOnLoad();updateParejaDisplay();save()}
function rBar(){$('bar').innerHTML='<b>Práctica:</b>'+[1,2,3,4].map(n=>`<button class="chip ${n===S.cur?'on':''}" onclick="go(${n})">P${n} · ${S.R[n]?S.R[n].s+'/100':'sin nota'}</button>`).join('')+'<button class="b ok" onclick="ev()">✅ Evaluar esta práctica</button><button class="b pr" onclick="dl()">⬇️ Descargar app (.html)</button><button class="b rd" onclick="clr()">🗑 Vaciar</button>'}
function rScr(){const s=$('scr'),a=A();s.className=mode;s.style.background=rb||a.bg;s.innerHTML='';
 const h=document.createElement('div');h.className='ttl';h.textContent=a.name;h.style.color=contrast(rb||a.bg);s.appendChild(h);
 a.els.forEach((e,i)=>{const w=document.createElement('div');w.className='el'+(e.id===sel&&mode==='edit'?' sel':'');let n;
  if(mode==='edit'){w.draggable=true;w.ondragstart=ev=>ev.dataTransfer.setData('text/plain','move:'+i);w.onclick=()=>{sel=e.id;render()}}
  if(e.t==='label'){n=document.createElement('div');n.className='lab';n.textContent=e.text;n.style.color=contrast(rb||a.bg)==='#fff'&&e.color==='#1e293b'?'#fff':e.color}
  else if(e.t==='image'){if(okUrl(e.src)){n=document.createElement('img');n.className='im';n.draggable=false;n.src=e.src;n.onerror=()=>n.replaceWith(ph('No se pudo cargar la imagen'))}else n=ph('🖼️ Pega la URL de una imagen')}
  else{n=document.createElement('button');n.className='bt';n.textContent=e.text;n.style.background=e.color;n.style.color=contrast(e.color);n.onclick=()=>mode==='test'&&run(e)}
  w.appendChild(n);s.appendChild(w)});
 if(!a.els.length){const d=document.createElement('div');d.className='hint';d.innerHTML='⬅️ Arrastra aquí etiquetas,<br>botones e imágenes';s.appendChild(d)}}
function ph(t){const d=document.createElement('div');d.className='ph';d.textContent=t;return d}
const f=(l,p,v,ty)=>`<label>${l}</label><input type="${ty||'text'}" value="${esc(v)}" oninput="u('${p}',this.value)">`;
function rPr(){const a=A(),e=E();
 let h=`<h3>⚙️ Aplicación</h3><label>Nombre de la app</label><input value="${esc(a.name)}" oninput="A().name=this.value;rScr();save()"><label>Color de fondo de la app</label><input type="color" value="${a.bg}" oninput="A().bg=this.value;rScr();save()"><hr style="margin:14px 0;border:0;border-top:1px solid #e2e8f0">`;
 if(!e||mode!=='edit')return $('pr').innerHTML=h+'<p class="m">Pulsa un elemento del móvil (modo ✏️ Editar) para cambiar su texto, color y acción.</p>';
 h+=`<h3>✏️ ${{label:'Etiqueta',button:'Botón',image:'Imagen'}[e.t]}</h3>`;
 if(e.t==='label')h+=f('Texto de la etiqueta','text',e.text)+f('Color del texto','color',e.color,'color');
 if(e.t==='image')h+=f('URL de la imagen (https://...)','src',e.src);
 if(e.t==='button'){h+=f('Nombre del botón','text',e.text)+f('Color del botón','color',e.color,'color')+`<label>Acción al pulsar</label><select onchange="ac_(this.value)">${[['img','🖼️ Mostrar imagen'],['bg','🎨 Cambiar fondo'],['sound','🔔 Reproducir tono'],['url','🌐 Abrir web']].map(x=>`<option value="${x[0]}" ${e.act===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  if(e.act==='bg')h+=f('Color de pantalla al pulsar','param',e.param,'color');
  if(e.act==='sound')h+=`<label>Sonido</label><select onchange="u('param',this.value);tone(this.value)">${Object.keys(T).map(k=>`<option value="${k}" ${e.param===k?'selected':''}>${T[k].n}</option>`).join('')}</select><button class="b" style="margin-top:6px" onclick="tone(E().param)">▶ Escuchar</button>`;
  if(e.act==='img')h+=f('URL de la foto (se ve 10 s)','param',e.param);
  if(e.act==='url')h+=f('URL de la web (se abre 10 s)','param',e.param)}
 $('pr').innerHTML=h+'<div class="row"><button class="b" onclick="mv(-1)">⬆ Subir</button><button class="b" onclick="mv(1)">⬇ Bajar</button><button class="b rd" onclick="del()">🗑</button></div>'}
function u(p,v){const e=E();if(e){e[p]=v;rScr();save()}}
function ac_(v){const e=E();e.act=v;e.param=v==='bg'?'#cbd5e1':v==='sound'?'beep':'';render()}
function mv(d){const a=A().els,i=a.findIndex(x=>x.id===sel),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function del(){A().els=A().els.filter(x=>x.id!==sel);sel=null;render()}
function clr(){if(confirm('¿Vaciar esta práctica?')){S.P[S.cur]=blank();delete S.R[S.cur];sel=null;render()}}
function go(n){cl();sel=null;rb=null;S.cur=n;render()}
function setMode(m){cl();mode=m;rb=null;render()}
function cl(){clearInterval(tm);const o=$('ov');if(o)o.remove();if(wn){try{wn.close()}catch(e){}wn=null}}
function ov(html,s){cl();const o=document.createElement('div');o.id='ov';o.innerHTML=html+`<p style="margin:4px 0 0">Volviendo a la app en <b id="cd">${s}</b> s</p><button class="b" onclick="cl()">Volver ya</button>`;$('scr').appendChild(o);let n=s;tm=setInterval(()=>{n--;const c=$('cd');if(c)c.textContent=n;if(n<=0)cl()},1000)}
function run(e){
 if(e.act==='bg'){rb=e.param;rScr()}
 else if(e.act==='sound')tone(e.param);
 else if(!okUrl(e.param))toast('Este botón no tiene una URL válida (https://...)');
 else if(e.act==='img')ov(`<img src="${esc(e.param)}" alt="">`,10);
 else if(e.act==='url'){
  ov(`<iframe src="${esc(e.param)}" style="width:100%;height:360px;border:0;border-radius:12px;background:#fff" title="Web"></iframe><div class="u">${esc(e.param)}</div>`,10);
 }}

  for(let k=0;k<ws.length;k++){const r=ws[k].getBoundingClientRect();if(e.clientY<r.top+r.height/2){i=k;break}}
  const[m,v]=d.split(':');if(m==='new')add(v,i);else if(m==='move'&&mode==='edit'){const fr=+v,[x]=a.splice(fr,1);a.splice(i>fr?i-1:i,0,x);render()}}}

 const js="const D="+d+";const $=i=>document.getElementById(i);let rb=null,tm,wn,ac;"

function validarDatos(){
 const n1=(S.al1_nom||'').trim();
 const a1=(S.al1_ape||'').trim();
 const n2=(S.al2_nom||'').trim();
 const a2=(S.al2_ape||'').trim();
 const pr=(S.prof||'').trim();

 const errs=[];
 if(n1.length<2) errs.push('Escribe el nombre del Alumno 1.');
 if(a1.length<2) errs.push('Escribe los apellidos del Alumno 1.');
 if(n2.length<2) errs.push('Escribe el nombre del Alumno 2 (si es individual, repite el del Alumno 1).');
 if(a2.length<2) errs.push('Escribe los apellidos del Alumno 2 (si es individual, repite los del Alumno 1).');
 if(pr.length<2) errs.push('Indica nombre profesor.');

 return errs;
}

function saveDatosForm(){
 S.al1_nom=($('al1_nom_in').value||'').trim();
 S.al1_ape=($('al1_ape_in').value||'').trim();
 S.al2_nom=($('al2_nom_in').value||'').trim();
 S.al2_ape=($('al2_ape_in').value||'').trim();
 S.prof=($('prof_in').value||'').trim();
 save();

 const errs=validarDatos();
 if(errs.length){
  $('team-error').innerHTML=errs.join('<br>');
  return false;
 }
 $('team-error').innerHTML='';
 updateParejaDisplay();
 mc();
 toast('✔ Datos guardados correctamente');
 return true;
}

function getNotaFinal(){
 const ok=[1,2,3,4].filter(n=>S.R[n]);
 if(!ok.length) return 0;
 const sum=ok.reduce((t,n)=>t+S.R[n].s,0);
 return Math.round((sum/4)*10)/10;
}

async function postRecord(params){
 try{
  const resp=await fetch(SHEET_WEBAPP_URL,{method:'POST',body:params});
  const data=await resp.json();
  if(!data.ok) throw new Error(data.error||'Respuesta no válida');
  return true;
 }catch(e1){
  try{
   await fetch(SHEET_WEBAPP_URL,{method:'POST',mode:'no-cors',body:params});
   return true;
  }catch(e2){
   return false;
  }
 }
}

async function sendResults(){
 const errs=validarDatos();
 if(errs.length){
  openDatosModal(errs.join('<br>'));
  return;
 }

 const okCount=[1,2,3,4].filter(n=>S.R[n]).length;
 if(okCount===0){
  toast('⚠️ Primero debes evaluar al menos una práctica para enviar tus notas.');
  return;
 }

 if(S.lockUntil && S.lockUntil > Date.now()){
  toast('🔒 Espera a que finalice el tiempo de bloqueo antes de enviar de nuevo.');
  return;
 }

 if(sendingNow) return;
 const btn=$('send-btn');
 if(btn&&btn.disabled) return;

 sendingNow=true;
 if(btn) btn.disabled=true;
 toast('Enviando resultados a la hoja de cálculo…');

 const now=new Date();
 const fecha=now.toLocaleDateString('es-ES');
 const hora=now.toLocaleTimeString('es-ES',{hour12:false});
 const uid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);

 const nombre1=(S.al1_nom+' '+S.al1_ape).trim();
 const nombre2=(S.al2_nom+' '+S.al2_ape).trim();
 const notaFinal=getNotaFinal();

 const params=new URLSearchParams({
  id:uid,
  fecha:fecha,
  hora:hora,
  alumno1:nombre1,
  alumno2:nombre2,
  curso:S.prof||'',
  criterio:ACTIVIDAD,
  total:notaFinal.toFixed(1),
  puntos_alumno1:notaFinal.toFixed(1),
  puntos_alumno2:notaFinal.toFixed(1),
  puntos_brutos_alumno1:notaFinal,
  puntos_brutos_alumno2:notaFinal
 });

 const enviado=await postRecord(params);
 sendingNow=false;

 if(enviado){
  toast('✔ Resultados enviados correctamente');
  startSendLock();
 }else{
  toast('❌ No se pudieron enviar los datos. Comprueba la conexión.');
  if(btn) btn.disabled=false;
 }
}

function startSendLock(untilTime){
 const btn=$('send-btn');
 if(!btn) return;
 const until = untilTime || (Date.now() + BLOQUEO_ENVIO_MS);
 S.lockUntil = until;
 save();
 btn.disabled = true;
 clearInterval(lockTimer);
 const tick=()=>{
  const left = (S.lockUntil || 0) - Date.now();
  if(left <= 0){
   clearInterval(lockTimer);
   delete S.lockUntil;
   save();
   btn.disabled = false;
   btn.innerText = '📤 Enviar datos';
   return;
  }
  const s = Math.ceil(left / 1000);
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, '0');
  btn.innerText = `🔒 Bloqueado ${m}:${sec}`;
 };
 tick();
 lockTimer = setInterval(tick, 500);
}

function checkSendLockOnLoad(){
 if(S.lockUntil && S.lockUntil > Date.now()){
  startSendLock(S.lockUntil);
 }
}
