<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Cyber Snake - Certificado de Captura</title>
    <style>
        :root { --p1: #00f2ff; --p2: #ff007f; }
        body { display: flex; margin: 0; height: 100vh; background: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #333; }

        #lobby {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 3000;
        }

        .player-section {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; border: 2px solid #ccc;
            background-color: white;
            transition: background-color 0.6s ease;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.05); 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }

        .quiz-card {
            background: white; color: #333; padding: 25px; border-radius: 15px;
            width: 85%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid #3498db; text-align: center;
        }

        .opt-btn {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            border: 2px solid #ddd; border-radius: 8px; background: #fdfdfd;
            cursor: pointer; text-align: left; font-size: 15px;
        }

        .hud { position: absolute; top: 20px; text-align: center; z-index: 50; width: 100%; }
        .score-num { font-size: 70px; font-weight: 900; margin: 0; color: #444; }
        .name-tag { font-size: 20px; font-weight: bold; color: #555; background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 20px; }

        canvas { background: #f9f9f9; border: 3px solid #555; border-radius: 10px; }

        .death-msg {
            background: #fff; padding: 20px; border-radius: 15px;
            border: 4px solid #e74c3c; text-align: center; color: #c0392b;
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button.start-btn {
            padding: 15px 35px; font-size: 18px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 50px;
            text-transform: uppercase; color: white; background: #333;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="font-size: 2.5rem; color:#2c3e50;">SNAKE <span style="color:var(--p1)">CYBER</span> TEST</h1>
        <p>Retos cada 5 pts | Giros relativos a la cabeza | Penalización por fallo</p>
        <div style="display: flex; gap: 20px; margin-bottom: 25px;">
            <input type="text" id="in-n1" value="ALUMNO 1" style="padding:12px; border:1px solid #ccc; border-radius:5px;">
            <input type="text" id="in-n2" value="ALUMNO 2" style="padding:12px; border:1px solid #ccc; border-radius:5px;">
        </div>
        <button onclick="setupPlayers()" style="padding:15px 40px; cursor:pointer; background:var(--p1); border:none; border-radius:8px; font-weight:bold;">CONFIGURAR DUELO</button>
    </div>

    <div id="area-1" class="player-section">
        <div class="hud">
            <div id="name-1" class="name-tag">---</div>
            <p id="score-1" class="score-num">0</p>
        </div>
        <canvas id="can-1"></canvas>
        <div id="overlay-1" class="overlay">
            <button class="start-btn" onclick="games[0].start()">INICIAR P1</button>
        </div>
    </div>

    <div id="area-2" class="player-section">
        <div class="hud">
            <div id="name-2" class="name-tag">---</div>
            <p id="score-2" class="score-num">0</p>
        </div>
        <canvas id="can-2"></canvas>
        <div id="overlay-2" class="overlay">
            <button class="start-btn" onclick="games[1].start()">INICIAR P2</button>
        </div>
    </div>

<script>
    // Banco de 30 preguntas sobre ciberseguridad, redes e internet
    const QUESTIONS = [
      { q: "¿Qué es el Phishing?", options: ["Un deporte náutico", "Engaño por email para robar claves", "Un tipo de cable de red"], correct: 1 },
      { q: "¿Qué contraseña es más segura?", options: ["12345678", "pAssw0rd!", "D0m1ng0_2024*"], correct: 2 },
      { q: "Si recibes un link sospechoso de un amigo:", options: ["Lo abro porque confío en él", "Le pregunto por otro medio si él lo envió", "Lo borro inmediatamente sin mirar"], correct: 1 },
      { q: "¿Qué indica el candado en la barra de direcciones?", options: ["Que la web es 100% legal", "Que la conexión está cifrada (HTTPS)", "Que no puedes copiar el contenido"], correct: 1 },
      { q: "Sobre las redes Wi-Fi públicas:", options: ["Son totalmente seguras", "Son ideales para entrar al banco", "Son poco seguras para datos privados"], correct: 2 },
      { q: "¿Qué es el Ciberacoso?", options: ["Un juego de rol online", "Acoso u humillación a través de redes", "Tener muchos seguidores"], correct: 1 },
      { q: "La webcam de tu ordenador debería estar:", options: ["Siempre encendida por si acaso", "Tapada físicamente cuando no se usa", "Apuntando siempre a la ventana"], correct: 1 },
      { q: "¿Qué información NO debes compartir?", options: ["Tu música favorita", "Tu dirección y número de teléfono", "Tu color de ojos"], correct: 1 },
      { q: "¿Qué es un Malware?", options: ["Un software para editar fotos", "Cualquier programa malicioso (virus, etc.)", "Un componente de la placa base"], correct: 1 },
      { q: "Si recibes un premio por SMS de un sorteo en el que no participaste:", options: ["Reclamo el premio rápido", "Es un intento de estafa", "Llamo al número para preguntar"], correct: 1 },
      { q: "¿Qué es el Grooming?", options: ["Un tipo de peinado moderno", "Adulto que engaña a menor online", "Cuidar a tu mascota virtual"], correct: 1 },
      { q: "Las redes sociales deben usarse para:", options: ["Compartir tus claves con amigos", "Ocio con configuración de privacidad", "Insultar a quien no te cae bien"], correct: 1 },
      { q: "¿Qué significa el 2FA?", options: ["Doble Factor de Autenticación", "Dos Ficheros Adjuntos", "Segunda Fase de Arranque"], correct: 0 },
      { q: "Tu perfil en redes sociales debería ser:", options: ["Público para ser famoso", "Privado (solo para conocidos)", "Con la dirección de tu casa"], correct: 1 },
      { q: "Si alguien te insulta en un videojuego online:", options: ["Le devuelvo el insulto", "Le ignoro, silencio y reporto", "Apago el router"], correct: 1 },
      { q: "¿Qué son las Fake News?", options: ["Noticias muy divertidas", "Noticias falsas para manipular", "Noticias sobre videojuegos"], correct: 1 },
      { q: "Actualizar el sistema operativo sirve para:", options: ["Gastar espacio y batería", "Cerrar agujeros de seguridad", "Que el ordenador vaya más lento"], correct: 1 },
      { q: "Un troyano es:", options: ["Un virus que se disfraza de programa útil", "Un programa para acelerar descargas", "Un antivirus gratuito"], correct: 0 },
      { q: "Si ves algo perturbador en internet:", options: ["No digo nada a nadie", "Se lo cuento a un adulto de confianza", "Lo comparto con todos mis contactos"], correct: 1 },
      { q: "¿Qué es la Huella Digital?", options: ["La marca de tu dedo en el móvil", "El rastro que dejas al navegar", "Un sistema de pago nuevo"], correct: 1 },
      { q: "El antivirus sirve para:", options: ["Limpiar el polvo del PC", "Detectar y eliminar amenazas", "Mejorar la velocidad de internet"], correct: 1 },
      { q: "¿Es seguro dar tu teléfono a desconocidos online?", options: ["Sí, para hacer amigos", "No, nunca", "Solo si me caen bien"], correct: 1 },
      { q: "¿Qué es el Ransomware?", options: ["Virus que secuestra tus archivos", "Un programa de edición de vídeo", "Un tipo de monitor"], correct: 0 },
      { q: "¿Se puede borrar algo de internet para siempre?", options: ["Sí, dándole a borrar", "Es casi imposible borrar el rastro total", "Solo si apagas el servidor"], correct: 1 },
      { q: "Los términos de uso de una App:", options: ["No hace falta leerlos nunca", "Es importante saber qué hacen con tus datos", "Son todos iguales"], correct: 1 },
      { q: "Un \"Hacker\" ético es alguien que:", options: ["Roba contraseñas por diversión", "Busca fallos para ayudar a arreglarlos", "Bloquea páginas del gobierno"], correct: 1 },
      { q: "Compartir tu ubicación en tiempo real es:", options: ["Muy seguro en cualquier red", "Peligroso si es público", "Necesario para jugar"], correct: 1 },
      { q: "El Spam es:", options: ["Un virus muy potente", "Correo basura no deseado", "Un comando de programación"], correct: 1 },
      { q: "¿Qué es un Firewall?", options: ["Una pared resistente al fuego", "Un sistema de defensa de red", "Un cable de alta velocidad"], correct: 1 },
      { q: "Cerrar sesión en ordenadores públicos es:", options: ["Opcional si tengo prisa", "Fundamental para proteger mis cuentas", "Malo para el ordenador"], correct: 1 }
    ];

    const GRID = 20;
    const SIZE = 400;
    let games = [];

    class SnakeGame {
        constructor(index, canvasId, scoreId, overlayId, areaId, nameId, color, startPos, dir) {
            this.index = index;
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            this.scoreEl = document.getElementById(scoreId);
            this.overlayEl = document.getElementById(overlayId);
            this.areaEl = document.getElementById(areaId);
            this.nameEl = document.getElementById(nameId);
            this.originalName = ""; 
            this.color = color;
            this.startPos = startPos;
            this.startDir = dir;
            this.canvas.width = SIZE;
            this.canvas.height = SIZE;
            this.score = 0;
            this.nextQuizAt = 5;
            this.active = false;
            this.reset(true);
        }

        reset(full) {
            this.snake = [{...this.startPos}];
            this.dir = {...this.startDir};
            this.nextDir = {...this.startDir};
            this.obstacles = [];
            if(full) { 
                this.score = 0; 
                this.nextQuizAt = 5; 
                this.nameEl.innerText = this.originalName;
            }
            this.spawnFood();
            this.lastTick = 0;
            this.updateUI();
        }

        start() { 
            this.active = true; 
            this.overlayEl.style.display = 'none'; 
            this.nameEl.innerText = this.originalName;
        }

        spawnFood() {
            this.food = { x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20) };
            if(this.obstacles.some(o=>o.x===this.food.x && o.y===this.food.y)) this.spawnFood();
        }

        updateUI() {
            // Mostramos con decimales si es necesario para el 0.5
            this.scoreEl.innerText = Number.isInteger(this.score) ? this.score : this.score.toFixed(1);
            
            // Código de colores estricto según la puntuación
            let bgColor = "white";
            if (this.score > 30) bgColor = "#f2d7d5"; // Rojo claro
            else if (this.score > 25) bgColor = "#fadbd8"; // Naranja claro
            else if (this.score > 20) bgColor = "#fcf3cf"; // Amarillo claro
            else if (this.score > 15) bgColor = "#d5f5e3"; // Verde claro
            else if (this.score > 10) bgColor = "#e8daef"; // Morado claro
            else if (this.score > 5) bgColor = "#d6eaf8";  // Azul claro
            else if (this.score > 2) bgColor = "#eaeded";  // Gris claro

            this.areaEl.style.backgroundColor = bgColor;
        }

        showQuiz() {
            this.active = false;
            // Seleccionar pregunta aleatoria
            const qData = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
            
            // Aleatorizar las opciones del test manteniendo registro de la correcta
            let optionsWithIndex = qData.options.map((opt, i) => ({ text: opt, isCorrect: i === qData.correct }));
            optionsWithIndex.sort(() => Math.random() - 0.5);

            this.overlayEl.style.display = 'flex';
            this.overlayEl.innerHTML = `
                <div class="quiz-card">
                    <h3 style="margin-bottom:15px; color:#2980b9;">🛡️ ${qData.q}</h3>
                    ${optionsWithIndex.map((optObj) => `<button class="opt-btn" onclick="games[${this.index}].handleAnswer(${optObj.isCorrect})">${optObj.text}</button>`).join('')}
                </div>`;
        }

        handleAnswer(isCorrect) {
            if(!isCorrect) { 
                this.score = Math.max(0, this.score - 2); 
            }
            this.updateUI();
            this.nextQuizAt += 5;

            // Mostrar pantalla intermedia con botón de pausa/reanudar para dar tiempo a reaccionar
            this.overlayEl.innerHTML = `
                <div class="quiz-card" style="text-align:center;">
                    <h3 style="margin-bottom:15px;">${isCorrect ? "¡Respuesta Correcta!" : "¡Respuesta Incorrecta (-2 pts)!"}</h3>
                    <button class="start-btn" onclick="games[${this.index}].resumeGame()">REANUDAR JUEGO</button>
                </div>`;
        }

        resumeGame() {
            this.overlayEl.style.display = 'none';
            this.active = true;
        }

        die() {
            this.active = false;
            const puntosFinales = this.score;
            
            this.updateUI();
            
            this.overlayEl.style.display = 'flex';
            this.overlayEl.innerHTML = `
                <div class="death-msg">
                    ¡FIN DEL JUEGO!<br>
                    Puntuación Final: <span style="font-size:22px; color:#2c3e50;">${puntosFinales}</span><br>
                    <button class="start-btn" style="margin-top:15px;" onclick="games[${this.index}].reset(true); games[${this.index}].start();">REINTENTAR</button>
                </div>`;
        }

        getInterval() {
            if (this.score < 10) return 260;
            let v = 130;
            return Math.max(40, v);
        }

        update(t) {
            if(!this.active) return;
            if(t - this.lastTick < this.getInterval()) return;
            this.lastTick = t;
            this.dir = this.nextDir;
            let head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };
            
            if(head.x<0 || head.x>=20 || head.y<0 || head.y>=20 || 
               this.snake.some(s=>s.x===head.x && s.y===head.y)) {
                this.die(); return;
            }
            
            this.snake.unshift(head);
            if(head.x === this.food.x && head.y === this.food.y) {
                this.score += 0.5; // Suma 0,5 puntos por manzana
                this.updateUI();
                
                if(this.score >= this.nextQuizAt) { 
                    this.showQuiz(); 
                    return; 
                }
                this.spawnFood();
            } else { 
                this.snake.pop(); 
            }
        }

        draw() {
            this.ctx.clearRect(0,0,SIZE,SIZE);
            this.ctx.fillStyle = "#2ecc71";
            this.ctx.fillRect(this.food.x*20+4, this.food.y*20+4, 12, 12);
            this.snake.forEach((s, i) => {
                this.ctx.fillStyle = i===0 ? "#333" : this.color;
                this.ctx.fillRect(s.x*20, s.y*20, 19, 19);
            });
        }
    }

    function setupPlayers() {
        const n1 = document.getElementById('in-n1').value;
        const n2 = document.getElementById('in-n2').value;
        document.getElementById('lobby').style.display = 'none';
        
        games = [
            new SnakeGame(0, 'can-1', 'score-1', 'overlay-1', 'area-1', 'name-1', '#3498db', {x:2,y:10}, {x:1,y:0}),
            new SnakeGame(1, 'can-2', 'score-2', 'overlay-2', 'area-2', 'name-2', '#e91e63', {x:17,y:10}, {x:-1,y:0})
        ];
        
        games[0].originalName = n1;
        games[1].originalName = n2;
        games[0].nameEl.innerText = n1;
        games[1].nameEl.innerText = n2;
        
        requestAnimationFrame(loop);
    }

    function loop(t) { games.forEach(g => { g.update(t); g.draw(); }); requestAnimationFrame(loop); }

    // Función auxiliar para giros relativos a la cabeza de la serpiente
    function turnRelative(currentDir, turn) {
        // turn: 'left' o 'right'
        if (turn === 'left') {
            return { x: currentDir.y, y: -currentDir.x };
        } else {
            return { x: -currentDir.y, y: currentDir.x };
        }
    }

    window.addEventListener('keydown', e => {
        // Controles Jugador 1 (W, A, S, D) - Movimiento relativo a la cabeza
        if (e.key.toLowerCase() === 'a') {
            games[0].nextDir = turnRelative(games[0].dir, 'left');
            e.preventDefault();
        } else if (e.key.toLowerCase() === 'd') {
            games[0].nextDir = turnRelative(games[0].dir, 'right');
            e.preventDefault();
        }

        // Controles Jugador 2 (Flechas de dirección) - Movimiento relativo a la cabeza
        if (e.key === 'ArrowLeft') {
            games[1].nextDir = turnRelative(games[1].dir, 'left');
            e.preventDefault();
        } else if (e.key === 'ArrowRight') {
            games[1].nextDir = turnRelative(games[1].dir, 'right');
            e.preventDefault();
        }
    });
</script>

</body></html>
