<!DOCTYPE html>
<!-- saved from url=(0039)https://delatj.github.io/web/brazo.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Robot Game - Alcance Corregido</title>
    <style>
        :root {
            --dark: #1a1a1a; --panel: #2c3e50; --accent: #f1c40f;
            --robot: #ecf0f1; --belt: #34495e; --danger: #e74c3c;
            --primary: #2ecc71;
        }
        body { 
            background: #333; 
            color: white; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            transition: background 1.2s ease; 
        }

        .sidebar { width: 310px; background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .header-score { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 2px solid var(--accent); }
        /* Puntuación multiplicada por tres en tamaño */
        .score-box { font-size: 5.4rem; font-weight: bold; color: var(--accent); line-height: 1; }
        .instructions { background: #111; padding: 12px; border-radius: 8px; border-left: 5px solid #2ecc71; min-height: 50px; font-size: 0.85rem; }
        
        .control-group { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 5px; }
        input[type="number"] { background: #000; border: 1px solid #444; color: var(--accent); padding: 8px; border-radius: 4px; text-align: center; width: 80%; margin: 0 auto; display: block; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .btn-move { background: var(--accent); color: #000; }
        .btn-grip { background: #9b59b6; color: white; }
        .btn-save { background: #3498db; color: white; grid-column: span 2; }

        .pos-list { flex-grow: 1; background: #111; border-radius: 6px; padding: 10px; overflow-y: auto; border: 1px solid #444; }
        .pos-card { background: #222; margin-bottom: 5px; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--accent); }
        .pos-actions { display: flex; gap: 5px; }

        #player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: white; padding: 35px; border-radius: 12px; text-align: center; color: #333; width: 320px; }
        .modal-box input { margin: 15px 0; width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }

        #status-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2001; }
        #status-msg { background: white; padding: 25px; border-radius: 8px; color: #155724; font-weight: bold; border: 4px solid var(--primary); text-align: center; max-width: 450px; }

        .viewport { flex-grow: 1; position: relative; overflow: hidden; }
        .conveyor { position: absolute; bottom: 0; width: 100%; height: 90px; background: var(--belt); border-top: 8px solid #222; z-index: 10; }
        
        #robot-system { position: absolute; bottom: 225px; left: 50%; z-index: 100; }
        .link { position: absolute; bottom: 0; left: -16px; width: 32px; background: var(--robot); border: 3px solid #7f8c8d; border-radius: 16px; transform-origin: bottom center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .link-main { height: 140px; } 
        .link-sub { height: 130px; bottom: 125px; left: -2px; }
        .gripper { position: absolute; bottom: 115px; left: -24px; width: 80px; height: 16px; background: #95a5a6; }
        .claw { position: absolute; width: 18px; height: 55px; background: var(--danger); border-radius: 4px; transition: transform 0.2s; }
        .claw-l { left: 8px; bottom: -45px; }
        .claw-r { right: 8px; bottom: -45px; }
        
        /* Piezas con borde negro añadido para mayor visibilidad */
        .piece { position: absolute; width: 40px; height: 40px; border-radius: 6px; z-index: 50; border: 2px solid #000; box-sizing: border-box; }
        
        .box { position: absolute; bottom: 90px; width: 110px; height: 80px; border: 5px solid #fff; background: rgba(255,255,255,0.1); border-top: none; z-index: 20; transition: left 0.5s ease-out; }
        .box-lid { position: absolute; top: -10px; left: -5px; width: 110px; height: 10px; background: rgba(255,255,255,0.5); border: 2px solid white; border-radius: 5px; }
        .box-label { background: white; color: black; font-size: 0.7rem; font-weight: bold; width: 100%; text-align: center; position: absolute; top: 5px; }
    </style>
</head>
<body>

    <div id="player-modal">
        <div class="modal-box">
            <h2>Ingeniería Robótica</h2>
            <p>Introduce tu nombre:</p>
            <input type="text" id="nombre-operario" placeholder="Nombre del Alumno">
            <button onclick="iniciarSesion()" style="background:var(--primary); color:white; width:100%; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">CONECTAR BRAZO</button>
        </div>
    </div>

    <div id="status-overlay">
        <div id="status-msg"></div>
    </div>

    <div class="sidebar">
        <div class="header-score">
            <span id="label-user">OP: ---</span>
            <div class="score-box" id="puntos">0</div>
        </div>
        <div class="instructions" id="mision-txt">Esperando conexión...</div>
        
        <div class="control-group">
            <label style="font-size: 0.7rem; color: #aaa;">Ángulo Base (A1)</label>
            <input type="number" id="inpA1" value="90">
            <label style="font-size: 0.7rem; color: #aaa;">Ángulo Brazo (A2)</label>
            <input type="number" id="inpA2" value="90">
        </div>

        <div class="btn-grid">
            <button class="btn-move" onclick="manualMove()">Mover</button>
            <button class="btn-grip" onclick="toggleClaw()" id="gripBtn">PINZA</button>
            <button class="btn-save" onclick="savePos()">Guardar Pos.</button>
        </div>
        
        <div class="pos-list" id="posList"></div>
    </div>

    <div class="viewport" id="factory">
        <div id="robot-system">
            <div class="link link-main" id="arm1" style="transform: rotate(90deg);">
                <div class="link link-sub" id="arm2" style="transform: rotate(90deg);">
                    <div class="gripper">
                        <div class="claw claw-l" id="cL"></div>
                        <div class="claw claw-r" id="cR"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="conveyor"></div>
    </div>

    <script>
        let puntos = 0;
        let isClawClosed = false;
        let itemHeld = null;
        let savedPositions = [];
        let operarioNombre = "";
        const colors = { 'rojo': '#e74c3c', 'azul': '#3498db', 'verde': '#2ecc71', 'amarillo': '#f1c40f', 'naranja': '#e67e22' };
        let misionesActivas = [];

        // Banco de 30 preguntas de ciberseguridad, redes e internet
        const bancoPreguntas = [
            { q: "¿Qué es una contraseña segura?", options: ["Una combinación de letras, números y símbolos", "Tu fecha de cumpleaños", "La palabra 'contraseña'"], correct: 0 },
            { q: "¿Qué debes hacer si recibes un mensaje sospechoso de alguien desconocido?", options: ["Hacer clic en todos los enlaces", "Ignorarlo y no compartir datos personales", "Enviar tus contraseñas"], correct: 1 },
            { q: "¿Qué significa el término 'Phishing'?", options: ["Un deporte acuático", "Un fraude para robar información personal mediante engaños", "Un antivirus gratuito"], correct: 1 },
            { q: "¿Es seguro conectarse a cualquier red Wi-Fi pública sin protección?", options: ["Sí, todas son seguras", "No, pueden interceptar tus datos", "Solo si tiene nombre oficial"], correct: 1 },
            { q: "¿Qué es la autenticación de doble factor (2FA)?", options: ["Tener dos teléfonos móviles", "Una capa extra de seguridad además de la contraseña", "Memorizar dos claves iguales"], correct: 1 },
            { q: "¿Qué información NUNCA debes publicar en redes sociales?", options: ["Tus gustos musicales", "Tu dirección completa y número de teléfono", "Una foto de un paisaje"], correct: 1 },
            { q: "¿Qué debes hacer con el software y sistema operativo de tus dispositivos?", options: ["No actualizarlos nunca", "Actualizarlos regularmente para corregir fallos de seguridad", "Borrar el sistema"], correct: 1 },
            { q: "¿Qué es el ciberacoso (cyberbullying)?", options: ["Jugar videojuegos en red", "Usar medios digitales para acosar o intimidar a alguien", "Un tipo de virus informático"], correct: 1 },
            { q: "¿Qué es un software malicioso o 'malware'?", options: ["Un programa útil para estudiar", "Un software diseñado para dañar o infiltrarse en sistemas", "Un componente físico del ordenador"], correct: 1 },
            { q: "¿Por qué es importante cerrar sesión en ordenadores compartidos?", options: ["Para ahorrar electricidad", "Para evitar que otros accedan a tus cuentas personales", "Para que la pantalla brille menos"], correct: 1 },
            { q: "¿Qué debes hacer si alguien te pide fotos íntimas en internet?", options: ["Enviarlas si es un amigo", "Rechazarlo, bloquear y avisar a un adulto de confianza", "Publicarlas en un perfil público"], correct: 1 },
            { q: "¿Qué es una copia de seguridad (backup)?", options: ["Borrar archivos antiguos", "Duplicar y guardar datos importantes en otro lugar seguro", "Imprimir documentos en papel"], correct: 1 },
            { q: "¿Qué indica un protocolo HTTPS en una página web?", options: ["Que la conexión está cifrada y es más segura", "Que la página es muy rápida", "Que la web es gratuita"], correct: 0 },
            { q: "¿Qué debes hacer ante un enlace acortado sospechoso en redes sociales?", options: ["Abrirlo inmediatamente", "No hacer clic si no confías en la fuente", "Compartirlo con tus amigos"], correct: 1 },
            { q: "¿Qué es la huella digital en internet?", options: ["Tus impresiones dactilares reales escaneadas", "El rastro de información que dejas al navegar online", "Un diseño de teclado táctil"], correct: 1 },
            { q: "¿Cuál es una buena práctica para gestionar tus contraseñas?", options: ["Usar la misma en todas partes", "Anotarlas en un papel pegado al monitor", "Usar contraseñas diferentes y un gestor seguro"], correct: 2 },
            { q: "¿Qué es el 'vishing'?", options: ["Phishing a través de llamadas telefónicas", "Un virus de vídeo", "Un juego de realidad virtual"], correct: 0 },
            { q: "¿Qué debes hacer si descubres que una cuenta tuya ha sido hackeada?", options: ["Dejarla abandonada", "Cambiar la contraseña de inmediato y revisar la actividad", "Apagar el router"], correct: 1 },
            { q: "¿Qué es el ransomware?", options: ["Un programa de diseño gráfico", "Un malware que bloquea tus archivos y pide rescate", "Un navegador web rápido"], correct: 1 },
            { q: "¿Es recomendable aceptar solicitudes de amistad de personas completamente desconocidas?", options: ["Sí, cuantos más amigos mejor", "No, podría ser un perfil falso con malas intenciones", "Solo si tienen foto bonita"], correct: 1 },
            { q: "¿Qué es el correo basura o 'spam'?", options: ["Correos electrónicos no deseados, normalmente publicitarios o maliciosos", "Mensajes importantes del colegio", "Archivos de música comprimidos"], correct: 0 },
            { q: "¿Qué debes hacer antes de descargar una aplicación móvil?", options: ["Revisar valoraciones, permisos y la reputación del desarrollador", "Descargarla sin mirar", "Aceptar todos los permisos sin leer"], correct: 0 },
            { q: "¿Qué es la Netiqueta?", options: ["Etiquetas para ropa comprada online", "El conjunto de normas de comportamiento en internet", "Una red social de fotografías"], correct: 1 },
            { q: "¿Por qué es peligroso usar redes Wi-Fi abiertas para hacer operaciones bancarias?", options: ["Porque gastan muchos datos", "Porque los datos pueden ser interceptados por ciberdelincuentes", "Porque la pantalla se apaga"], correct: 1 },
            { q: "¿Qué es la ingeniería social en ciberseguridad?", options: ["Construir redes sociales", "Manipular psicológicamente a las personas para que revelen datos", "Una red de ordenadores escolares"], correct: 1 },
            { q: "¿Qué debes hacer si ves un comentario ofensivo o acoso en redes?", options: ["Unirte a los insultos", "Reportar la publicación y bloquear al usuario", "Ignorarlo y borrar tu cuenta"], correct: 1 },
            { q: "¿Qué es un firewall (cortafuegos)?", options: ["Un sistema físico para apagar incendios informáticos", "Un dispositivo o software que filtra el tráfico de red según reglas de seguridad", "Un juego de estrategia"], correct: 1 },
            { q: "¿Qué información se considera dato personal sensible?", options: ["Tu color favorito", "Tu DNI, número de cuenta bancaria y datos médicos", "Tu comida preferida"], correct: 1 },
            { q: "¿Qué significa configurar una cuenta de redes sociales como 'privada'?", options: ["Que solo tus amigos aprobados pueden ver tu contenido", "Que nadie en el mundo puede encontrarte", "Que la plataforma te paga dinero"], correct: 0 },
            { q: "¿Por qué no debes creer todo lo que ves en internet (noticias falsas o fake news)?", options: ["Porque todo en internet es mentira", "Porque cualquier persona puede publicar información sin verificar", "Porque los ordenadores fallan"], correct: 1 }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") { e.preventDefault(); toggleClaw(); }
        });

        function iniciarSesion() {
            const nom = document.getElementById('nombre-operario').value.trim();
            if(!nom) return alert("Escribe tu nombre.");
            operarioNombre = nom;
            document.getElementById('label-user').innerText = "OP: " + nom.split(" ")[0];
            document.getElementById('player-modal').style.display = 'none';
            updateBackground();
            setMision(true);
            manualMove(); 
        }

        function setMision(forceNewPosition = false) {
            const shouldChangePos = forceNewPosition || (puntos > 0 && puntos % 2 === 0);
            const keys = Object.keys(colors);
            const nextColor = keys[Math.floor(Math.random()*keys.length)];

            if (shouldChangePos) {
                document.querySelectorAll('.box').forEach(b => b.remove());
                misionesActivas = [];
                const safeX = (Math.random() * 280) - 140; 
                createBox(safeX, nextColor);
            } else {
                if (misionesActivas.length > 0) {
                    const m = misionesActivas[0];
                    m.color = nextColor;
                    m.el.style.borderColor = colors[nextColor];
                    m.el.querySelector('.box-label').innerText = nextColor.toUpperCase();
                }
            }

            const targetColorName = misionesActivas[0].color.toUpperCase();
            document.getElementById('mision-txt').innerText = `MISIÓN: ¡Caja movida! Clasifica piezas de color ${targetColorName}.`;
        }

        function createBox(x, colorTarget) {
            const b = document.createElement('div');
            b.className = 'box';
            const absX = (window.innerWidth / 2) + x - 55;
            b.style.left = absX + "px";
            b.style.borderColor = colors[colorTarget];
            
            const lid = document.createElement('div');
            lid.className = 'box-lid';
            
            const l = document.createElement('div');
            l.className = 'box-label';
            l.innerText = colorTarget.toUpperCase();
            
            b.appendChild(lid);
            b.appendChild(l);
            document.getElementById('factory').appendChild(b);
            misionesActivas.push({ el: b, color: colorTarget });
        }

        function updateBackground() {
            let bg = "#333"; 
            if (puntos > 2) bg = "#3498db";   
            if (puntos > 5) bg = "#8e44ad";   
            if (puntos > 15) bg = "#2ecc71";  
            if (puntos > 20) bg = "#f1c40f";  
            if (puntos > 25) bg = "#e67e22";  
            if (puntos > 30) bg = "#e74c3c";  
            document.body.style.backgroundColor = bg;
        }

        function manualMove() {
            document.getElementById('arm1').style.transform = `rotate(${document.getElementById('inpA1').value}deg)`;
            document.getElementById('arm2').style.transform = `rotate(${document.getElementById('inpA2').value}deg)`;
        }

        function toggleClaw() {
            isClawClosed = !isClawClosed;
            const cL = document.getElementById('cL'), cR = document.getElementById('cR');
            const gripBtn = document.getElementById('gripBtn');

            if (isClawClosed) {
                cL.style.transform = "translateX(18px)";
                cR.style.transform = "translateX(-18px)";
                gripBtn.innerText = "SOLTAR";
                
                if (!itemHeld) {
                    const gripRect = cL.getBoundingClientRect();
                    document.querySelectorAll('.piece').forEach(p => {
                        if (!p.dataset.scored) {
                            const pR = p.getBoundingClientRect();
                            if (Math.abs(gripRect.x - pR.x) < 55 && Math.abs(gripRect.y - pR.y) < 55) {
                                itemHeld = p;
                            }
                        }
                    });
                }
            } else {
                cL.style.transform = "translateX(0)";
                cR.style.transform = "translateX(0)";
                gripBtn.innerText = "PINZA";
                if(itemHeld) releasePiece();
            }
        }

        function releasePiece() {
            const p = itemHeld; 
            itemHeld = null;
            let y = parseFloat(p.style.top);
            let x = parseFloat(p.style.left);

            const gravity = setInterval(() => {
                y += 8; 
                p.style.top = y + "px";

                const pRect = p.getBoundingClientRect();

                misionesActivas.forEach(m => {
                    if (!p.dataset.scored) {
                        const boxRect = m.el.getBoundingClientRect();
                        if (
                            pRect.right >= boxRect.left &&
                            pRect.left <= boxRect.right &&
                            pRect.bottom >= boxRect.top &&
                            pRect.top <= boxRect.bottom
                        ) {
                            if (p.getAttribute('data-color') === m.color) {
                                p.dataset.scored = "true";
                                puntos++;
                                document.getElementById('puntos').innerText = puntos;
                                p.style.opacity = "0";
                                updateBackground();
                                
                                clearInterval(gravity);
                                setTimeout(() => p.remove(), 500);

                                if (puntos > 0 && puntos % 5 === 0) {
                                    setTimeout(lanzarPreguntaCiberseguridad, 400);
                                } else {
                                    setTimeout(() => setMision(), 500);
                                }
                            }
                        }
                    }
                });

                if (y > window.innerHeight - 130) { 
                    clearInterval(gravity); 
                    setTimeout(() => p.remove(), 500); 
                }
            }, 20);
        }

        function lanzarPreguntaCiberseguridad() {
            const preguntaObj = bancoPreguntas[Math.floor(Math.random() * bancoPreguntas.length)];
            
            let opcionesMezcladas = preguntaObj.options.map((texto, index) => ({ texto, originalIndex: index }));
            opcionesMezcladas.sort(() => Math.random() - 0.5);

            const overlay = document.getElementById('status-overlay');
            const msg = document.getElementById('status-msg');
            
            let htmlOpciones = "";
            opcionesMezcladas.forEach((op, idx) => {
                htmlOpciones += `<button onclick="verificarRespuesta(${op.originalIndex === preguntaObj.correct})" style="background:#2c3e50; color:white; padding:10px; margin:5px 0; width:100%; border:none; border-radius:4px; cursor:pointer; text-align:left; font-size:0.9rem;">${idx + 1}. ${op.texto}</button>`;
            });

            msg.innerHTML = `
                <h3 style="color:#c0392b; margin-top:0;">¡CONTROL DE CIBERSEGURIDAD! (${puntos} Pts)</h3>
                <p style="font-size:0.95rem; font-weight:normal; color:#333;">${preguntaObj.q}</p>
                <div style="display:flex; flex-direction:column;">${htmlOpciones}</div>
                <p style="font-size:0.75rem; color:#666; margin-top:10px;">⚠️ Si fallas, perderás 2 puntos.</p>
            `;
            overlay.style.display = 'flex';
        }

        window.verificarRespuesta = function(esCorrecta) {
            const overlay = document.getElementById('status-overlay');
            const msg = document.getElementById('status-msg');

            if (esCorrecta) {
                puntos++;
                msg.innerHTML = `<h3 style="color:#27ae60;">¡Respuesta Correcta!</h3><p style="color:#333;">¡Ganaste 1 punto extra por tu conocimiento en internet!</p>`;
            } else {
                puntos = Math.max(0, puntos - 2);
                msg.innerHTML = `<h3 style="color:#c0392b;">¡Respuesta Incorrecta!</h3><p style="color:#333;">Se te han restado 2 puntos por fallo de seguridad.</p>`;
            }

            document.getElementById('puntos').innerText = puntos;
            updateBackground();

            setTimeout(() => {
                overlay.style.display = 'none';
                setMision(true);
            }, 2000);
        }

        function createPiece() {
            if (!operarioNombre) return;
            const keys = Object.keys(colors);
            const c = keys[Math.floor(Math.random()*keys.length)];
            const p = document.createElement('div');
            p.className = 'piece';
            p.style.backgroundColor = colors[c];
            p.setAttribute('data-color', c);
            p.style.left = "-50px";
            p.style.top = (window.innerHeight - 130) + "px";
            document.getElementById('factory').appendChild(p);
            
            let xPos = -50;
            const belt = setInterval(() => {
                if (itemHeld === p) { clearInterval(belt); return; }
                xPos += 2.5; 
                p.style.left = xPos + "px";
                if (xPos > window.innerWidth) { p.remove(); clearInterval(belt); }
            }, 30);
        }

        function savePos() {
            savedPositions.push({a1: document.getElementById('inpA1').value, a2: document.getElementById('inpA2').value});
            renderList();
        }

        function deletePos(index) {
            savedPositions.splice(index, 1);
            renderList();
        }

        function renderList() {
            document.getElementById('posList').innerHTML = savedPositions.map((p, i) => `
                <div class="pos-card">
                    <span style="font-size:0.8rem">P${i+1}: ${p.a1}°, ${p.a2}°</span>
                    <div class="pos-actions">
                        <button onclick="goTo(${p.a1}, ${p.a2})" style="background:var(--primary); color:white; padding:4px 8px; font-size:0.7rem;">IR</button>
                        <button onclick="deletePos(${i})" style="background:var(--danger); color:white; padding:4px 8px; font-size:0.7rem;">X</button>
                    </div>
                </div>
            `).join('');
        }

        function goTo(a1, a2) {
            document.getElementById('inpA1').value = a1;
            document.getElementById('inpA2').value = a2;
            manualMove();
        }

        setInterval(() => {
            if (itemHeld) {
                const g = document.getElementById('cL').getBoundingClientRect();
                const f = document.getElementById('factory').getBoundingClientRect();
                itemHeld.style.left = (g.left - f.left + 20) + "px";
                itemHeld.style.top = (g.top - f.top + 20) + "px";
            }
        }, 16);

        setInterval(createPiece, 4000);
    </script>

</body></html>
