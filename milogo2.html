<!DOCTYPE html>
<!-- saved from url=(0041)https://delatj.github.io/web/milogo2.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimiento de Tortuga: Dos Jugadores</title>
    <style>
        body {
            transition: background-color 0.5s;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 50%;
            transition: background-color 0.5s;
            padding: 10px;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 2px;
            border: 2px solid black;
        }

        .grid-item {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .character {
            width: 40px;
            height: 20px;
            background-color: lightblue;
            border-radius: 0px 10px 10px 0px;
            border-right: 3px solid black;
            transform-origin: center center;
            transition: transform 0.3s;
        }

        .goal {
            background-color: lightgreen;
            border-radius: 50%;
            color: black;
            font-weight: bold;
        }

        .obstacle {
            background-color: red;
            border-radius: 50%;
            color: white;
            font-weight: bold;
        }

        .score {
            font-size: 4em;
            font-weight: bold;
            color: black;
            margin: 5px 0;
        }

        .instructions {
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .divider {
            height: 100vh;
            width: 2px;
            background-color: black;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
        }

        #player-names-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #player-names-form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 460px;
            max-width: 92%;
            max-height: 92vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        #player-names-form .team-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 6px 10px 10px;
            margin: 10px 0;
            background: #f7f9fc;
        }
        #player-names-form .team-card h3 { margin: 6px 0 0; font-size: 1.05em; }
        #player-names-form .team-error {
            color: #b71c1c;
            font-size: 0.9em;
            min-height: 1em;
            margin-top: 6px;
        }
        #send-panel {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            z-index: 500;
            max-width: 260px;
            display: none;
        }
        #send-btn {
            padding: 10px 16px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        #send-btn:disabled { background-color: #cbd5e1; color: #555; cursor: not-allowed; }
        #send-status { font-size: 13px; margin-top: 6px; }
        #send-status.ok { color: #1b5e20; }
        #send-status.err { color: #b71c1c; }
        #send-status.wait { color: #8a5a00; }

        #player-names-form h2 {
            margin-top: 0;
        }

        #player-names-form input {
            margin: 10px;
            padding: 8px;
            width: 80%;
        }

        #player-names-form button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="player-names-modal">
        <div id="player-names-form">
            <h2>Datos de los alumnos</h2>
            <div class="team-card">
                <h3>Alumno/a 1 (jugador izquierdo)</h3>
                <input type="text" id="player1-first" autocomplete="off" placeholder="Nombre. Ej: Lucía">
                <input type="text" id="player1-last" autocomplete="off" placeholder="Apellidos. Ej: Pérez Gómez">
            </div>
            <div class="team-card">
                <h3>Alumno/a 2 (jugador derecho)</h3>
                <input type="text" id="player2-first" autocomplete="off" placeholder="Nombre. Ej: Marcos">
                <input type="text" id="player2-last" autocomplete="off" placeholder="Apellidos. Ej: Díaz Ruiz">
            </div>
            <input type="text" id="student-group" autocomplete="off" placeholder="Curso y grupo. Ej: 2º ESO A">
            <div id="team-error" class="team-error"></div>
            <button id="start-game">Comenzar Juego</button>
        </div>
    </div>

    <div id="send-panel">
        <button id="send-btn" type="button">📤 Enviar resultados</button>
        <div id="send-status"></div>
    </div>

    <div class="game-area" id="leftArea">
        <h2 id="player1-title">Jugador Izquierdo</h2>
        <div class="grid-container" id="gridLeft"></div>
        <div class="score" id="scoreLeft">0.0</div>
        <div class="instructions">
            Controles:<br>
            W - Avanzar<br>
            S - Retroceder<br>
            A - Girar izquierda<br>
            D - Girar derecha
        </div>
    </div>

    <div class="divider"></div>

    <div class="game-area" id="rightArea">
        <h2 id="player2-title">Jugador Derecho</h2>
        <div class="grid-container" id="gridRight"></div>
        <div class="score" id="scoreRight">0.0</div>
        <div class="instructions">
            Controles:<br>
            ↑ - Avanzar<br>
            ↓ - Retroceder<br>
            ← - Girar izquierda<br>
            → - Girar derecha
        </div>
    </div>

    <script>
        const gridSize = 6;
        let players = {
            left: {
                position: { x: 0, y: 0 },
                direction: 0,
                score: 0,
                rewards: [],
                obstacles: [],
                currentRewardIndex: 0,
                name: ""
            },
            right: {
                position: { x: 0, y: 0 },
                direction: 0,
                score: 0,
                rewards: [],
                obstacles: [],
                currentRewardIndex: 0,
                name: ""
            }
        };

        function generateRewardsAndObstacles(player) {
            player.rewards = [];
            player.obstacles = [];

            const usedPositions = new Set();
            const rewardPositions = [];

            function positionKey(pos) {
                return `${pos.x},${pos.y}`;
            }

            function isPositionValid(pos, positions) {
                for (const rewardPos of positions) {
                    const dx = Math.abs(pos.x - rewardPos.x);
                    const dy = Math.abs(pos.y - rewardPos.y);
                    if (dx <= 1 && dy <= 1) {
                        return false;
                    }
                }
                return true;
            }

            function uniqueRandomPosition() {
                let pos, attempts = 0;
                do {
                    pos = randomPosition();
                    attempts++;
                    if (attempts > 100) {
                        console.error("No se pudo encontrar posición válida");
                        return null;
                    }
                } while (
                    usedPositions.has(positionKey(pos)) || 
                    !isPositionValid(pos, rewardPositions)
                );
                
                usedPositions.add(positionKey(pos));
                return pos;
            }

            for (let i = 0; i < 4; i++) {
                const rewardPos = uniqueRandomPosition();
                if (!rewardPos) break;
                
                rewardPositions.push(rewardPos);
                player.rewards.push({ ...rewardPos, order: i + 1 });
            }

            for (let i = 0; i < 3; i++) {
                const obstaclePos = randomPosition();
                if (!usedPositions.has(positionKey(obstaclePos))) {
                    player.obstacles.push(obstaclePos);
                    usedPositions.add(positionKey(obstaclePos));
                }
            }
        }

        function randomPosition() {
            return {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
        }

        function renderGrid(player, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = "";

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement("div");
                    cell.classList.add("grid-item");

                    if (x === player.position.x && y === player.position.y) {
                        const character = document.createElement("div");
                        character.classList.add("character");
                        character.style.transform = `rotate(${player.direction}deg)`;
                        cell.appendChild(character);
                    } else {
                        const reward = player.rewards.find(r => r.x === x && r.y === y);
                        const obstacle = player.obstacles.find(o => o.x === x && o.y === y);

                        if (reward) {
                            cell.classList.add("goal");
                            cell.textContent = reward.order;
                        } else if (obstacle) {
                            cell.classList.add("obstacle");
                        }
                    }

                    grid.appendChild(cell);
                }
            }
        }

        function movePlayer(player, direction, gridId) {
            const newPosition = { ...player.position };

            if (direction === "forward") {
                if (player.direction === 0) newPosition.x++;
                if (player.direction === 90) newPosition.y++;
                if (player.direction === 180) newPosition.x--;
                if (player.direction === 270) newPosition.y--;
            } else if (direction === "backward") {
                if (player.direction === 0) newPosition.x--;
                if (player.direction === 90) newPosition.y--;
                if (player.direction === 180) newPosition.x++;
                if (player.direction === 270) newPosition.y++;
            }

            if (newPosition.x < 0 || newPosition.x >= gridSize || 
                newPosition.y < 0 || newPosition.y >= gridSize) {
                player.score -= 0.1;
                player.score = Math.round(player.score * 10) / 10;
                updateScore(player, gridId);
                return;
            }

            checkPosition(player, newPosition, gridId);
        }

        function rotatePlayer(player, rotation, gridId) {
            player.direction = (player.direction + rotation + 360) % 360;
            renderGrid(player, gridId);
        }

        function checkPosition(player, newPosition, gridId) {
            const obstacle = player.obstacles.find(o => o.x === newPosition.x && o.y === newPosition.y);
            const reward = player.rewards.find(r => r.x === newPosition.x && r.y === newPosition.y);

            if (obstacle) {
                player.score -= 0.1;
                player.score = Math.round(player.score * 10) / 10;
            } else if (reward) {
                if (reward.order === player.currentRewardIndex + 1) {
                    player.currentRewardIndex++;
                    if (player.currentRewardIndex === player.rewards.length) {
                        player.score += 0.1;
                        player.score = Math.round(player.score * 10) / 10;
                        player.currentRewardIndex = 0;
                        generateRewardsAndObstacles(player);
                    }
                } else {
                    return;
                }
            }

            player.position = newPosition;
            updateScore(player, gridId);
        }

        function updateScore(player, gridId) {
            const scoreElementId = gridId === "gridLeft" ? "scoreLeft" : "scoreRight";
            const areaId = gridId === "gridLeft" ? "leftArea" : "rightArea";
            const areaElement = document.getElementById(areaId);

            document.getElementById(scoreElementId).textContent = player.score.toFixed(1);

            if (player.score > 30) {
                areaElement.style.backgroundColor = "red";
            } else if (player.score > 25) {
                areaElement.style.backgroundColor = "orange";
            } else if (player.score > 20) {
                areaElement.style.backgroundColor = "yellow";
            } else if (player.score > 15) {
                areaElement.style.backgroundColor = "green";
            } else if (player.score > 10) {
                areaElement.style.backgroundColor = "purple";
            } else if (player.score > 5) {
                areaElement.style.backgroundColor = "blue";
            } else if (player.score > 2) {
                areaElement.style.backgroundColor = "gray";
            } else {
                areaElement.style.backgroundColor = "white";
            }

            renderGrid(player, gridId);
        }

        /* ====== DATOS DE LOS ALUMNOS, INICIO Y ENVÍO DE RESULTADOS ====== */
        const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyiOndS6GMYhgiSGLVAXUOOHhMKtBXqcLUeOppbNZIkrxU-HiMlgmhlYCj1xYZQG0io/exec";
        const ACTIVIDAD = "Milogo2";
        const BLOQUEO_ENVIO_MS = 3 * 60 * 1000; // 3 minutos tras un envío correcto

        let gameStarted = false;
        let sending = false;
        let lockTimer = null;

        function cleanName(v) { return v.trim().replace(/\s+/g, ' '); }
        const getVal = id => cleanName(document.getElementById(id).value);

        document.getElementById('start-game').addEventListener('click', () => {
            const err = document.getElementById('team-error');
            const msgs = [];

            if (getVal('player1-first').length < 2) msgs.push('Escribe el nombre del alumno/a 1.');
            if (getVal('player1-last').length < 2) msgs.push('Escribe los apellidos del alumno/a 1.');
            if (getVal('player2-first').length < 2) msgs.push('Escribe el nombre del alumno/a 2.');
            if (getVal('player2-last').length < 2) msgs.push('Escribe los apellidos del alumno/a 2.');
            if (!getVal('student-group')) msgs.push('Indica el curso y grupo.');

            if (msgs.length) {
                err.innerHTML = msgs.join('<br>');
                return;
            }
            err.innerHTML = '';

            const player1Name = getVal('player1-first') + ' ' + getVal('player1-last');
            const player2Name = getVal('player2-first') + ' ' + getVal('player2-last');

            players.left.name = player1Name;
            players.right.name = player2Name;

            document.getElementById('player1-title').textContent = player1Name;
            document.getElementById('player2-title').textContent = player2Name;

            document.getElementById('player-names-modal').style.display = 'none';
            document.getElementById('send-panel').style.display = 'block';
            gameStarted = true;

            generateRewardsAndObstacles(players.left);
            generateRewardsAndObstacles(players.right);
            renderGrid(players.left, "gridLeft");
            renderGrid(players.right, "gridRight");
        });

        function setSendStatus(text, cls) {
            const st = document.getElementById('send-status');
            st.textContent = text;
            st.className = cls || '';
        }

        function startSendLock() {
            const btn = document.getElementById('send-btn');
            const until = Date.now() + BLOQUEO_ENVIO_MS;
            btn.disabled = true;
            clearInterval(lockTimer);
            const tick = () => {
                const left = until - Date.now();
                if (left <= 0) {
                    clearInterval(lockTimer);
                    btn.disabled = false;
                    btn.textContent = '📤 Enviar resultados';
                    setSendStatus('Ya puedes enviar de nuevo si quieres actualizar tu puntuación.', 'wait');
                    return;
                }
                const s = Math.ceil(left / 1000);
                btn.textContent = '🔒 Bloqueado ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
            };
            tick();
            lockTimer = setInterval(tick, 500);
        }

        async function sendResults() {
            if (!gameStarted || sending) return;
            const btn = document.getElementById('send-btn');
            if (btn.disabled) return;

            sending = true;
            btn.disabled = true; // evita pulsaciones repetidas mientras se envía
            setSendStatus('Enviando resultados a la hoja de cálculo…', 'wait');

            const puntosIzq = Math.round(players.left.score * 10) / 10;
            const puntosDer = Math.round(players.right.score * 10) / 10;
            const now = new Date();
            const params = new URLSearchParams({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                fecha: now.toLocaleDateString('es-ES'),
                hora: now.toLocaleTimeString('es-ES', { hour12: false }),
                alumno1: players.left.name,
                alumno2: players.right.name,
                curso: getVal('student-group'),
                criterio: ACTIVIDAD,
                total: (Math.round((puntosIzq + puntosDer) * 10) / 10).toFixed(1),
                puntos_alumno1: puntosIzq.toFixed(1),
                puntos_alumno2: puntosDer.toFixed(1)
            });

            let ok = false;
            try {
                // Primer intento: respuesta legible (confirma la recepción)
                const resp = await fetch(SHEET_WEBAPP_URL, { method: 'POST', body: params });
                const data = await resp.json();
                if (!data.ok) throw new Error(data.error || 'Respuesta no válida');
                ok = true;
                setSendStatus('✔ Resultados enviados correctamente.', 'ok');
            } catch (e1) {
                try {
                    // Segundo intento sin leer respuesta (el servidor ignora duplicados por ID)
                    await fetch(SHEET_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: params });
                    ok = true;
                    setSendStatus('✔ Resultados enviados (no se pudo leer la confirmación del servidor).', 'ok');
                } catch (e2) {
                    setSendStatus('❌ No se pudieron enviar. Comprueba la conexión y pulsa de nuevo.', 'err');
                }
            }

            sending = false;
            if (ok) startSendLock();      // envío correcto: bloqueo de 3 minutos
            else btn.disabled = false;    // si falla, se puede reintentar
        }

        document.getElementById('send-btn').addEventListener('click', sendResults);

        window.addEventListener("keydown", (event) => {
            if (!gameStarted) return;
            const t = event.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

            switch (event.key) {
                case "w": movePlayer(players.left, "forward", "gridLeft"); break;
                case "s": movePlayer(players.left, "backward", "gridLeft"); break;
                case "a": rotatePlayer(players.left, -90, "gridLeft"); break;
                case "d": rotatePlayer(players.left, 90, "gridLeft"); break;
                case "ArrowUp": movePlayer(players.right, "forward", "gridRight"); break;
                case "ArrowDown": movePlayer(players.right, "backward", "gridRight"); break;
                case "ArrowLeft": rotatePlayer(players.right, -90, "gridRight"); break;
                case "ArrowRight": rotatePlayer(players.right, 90, "gridRight"); break;
            }
        });
    </script>

</body></html>
