<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de SO - Entorno Seguro</title>
    <script src="https://unpkg.com/v86@latest/build/v86_all.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; }
        body { background: #11111b; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #181825; border: 1px solid #45475a; padding: 20px; border-radius: 8px; width: 100%; max-width: 680px; margin-bottom: 15px; }
        h2 { color: #89b4fa; margin-bottom: 10px; }
        input[type="file"] { margin: 10px 0; width: 100%; background: #313244; padding: 10px; border-radius: 4px; color: #fff; border: 1px solid #45475a; }
        button { background: #a6e3a1; color: #11111b; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:disabled { background: #45475a; color: #7f849c; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 0.9rem; color: #f9e2af; font-weight: bold; }
        #screen_container { width: 640px; height: 400px; background: #000; border: 2px solid #89b4fa; border-radius: 6px; display: none; margin-top: 15px; overflow: hidden; }
        #screen_container canvas { width: 100% !important; height: 100% !important; }
        #screen_container div { font-family: monospace !important; color: #a6e3a1 !important; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Simulador de Arranque de Sistema Operativo</h2>
        <p style="font-size: 0.9rem; color: #bac2de;">
            Carga la ISO descargada (ej. Tiny Core o SliTaz) para iniciar el arranque virtual en la memoria RAM:
        </p>
        <input type="file" id="iso-file" accept=".iso">
        <button id="start-btn" onclick="startSystem()" disabled>Cargar e Iniciar SO</button>
        <div id="status"></div>
    </div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <script>
        const isoInput = document.getElementById('iso-file');
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');

        isoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) startBtn.disabled = false;
        });

        function startSystem() {
            const file = isoInput.files[0];
            if (!file) return;

            startBtn.disabled = true;
            statusDiv.innerText = "Lectura de imagen ISO en memoria RAM...";

            const reader = new FileReader();
            
            // Leemos el archivo local como Buffer para entregárselo directamente a WebAssembly
            reader.onload = function(e) {
                const buffer = e.target.result;
                statusDiv.innerText = "Iniciando máquina virtual x86...";
                
                document.getElementById('screen_container').style.display = 'block';

                try {
                    const emulator = new V86Starter({
                        wasm_path: "https://unpkg.com/v86@latest/build/v86.wasm",
                        memory_size: 128 * 1024 * 1024, // 128 MB RAM
                        vga_memory_size: 8 * 1024 * 1024,
                        screen_container: document.getElementById("screen"),
                        bios: { url: "https://unpkg.com/v86@latest/bios/seabios.bin" },
                        vga_bios: { url: "https://unpkg.com/v86@latest/bios/vgabios.bin" },
                        cdrom: { buffer: buffer }, // Pasamos la ISO procesada como buffer
                        autostart: true
                    });

                    emulator.add_listener("emulator-ready", function() {
                        statusDiv.innerText = "¡Sistema iniciado! Haz clic en la pantalla virtual para interactuar.";
                        statusDiv.style.color = "#a6e3a1";
                    });

                } catch (err) {
                    statusDiv.innerText = "Error al iniciar el emulador: " + err.message;
                    statusDiv.style.color = "#f38ba8";
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
