<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de SO - Entorno Seguro</title>
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/v86_all.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; }
        body { background: #11111b; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #181825; border: 1px solid #45475a; padding: 20px; border-radius: 8px; width: 100%; max-width: 680px; margin-bottom: 15px; }
        h2 { color: #89b4fa; margin-bottom: 10px; }
        input[type="file"] { margin: 10px 0; width: 100%; background: #313244; padding: 10px; border-radius: 4px; color: #fff; border: 1px solid #45475a; }
        button { background: #a6e3a1; color: #11111b; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:disabled { background: #45475a; color: #7f849c; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 0.9rem; color: #f9e2af; font-weight: bold; }
        #screen_container { width: 640px; height: 400px; background: #000; border: 2px solid #89b4fa; border-radius: 6px; display: none; margin-top: 15px; overflow: hidden; position: relative; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Simulador de Arranque de Sistema Operativo</h2>
        <p style="font-size: 0.9rem; color: #bac2de;">
            Carga la ISO descargada (ej. Tiny Core o SliTaz) para iniciar el arranque virtual en la memoria RAM:
        </p>
        <input type="file" id="iso-file" accept=".iso">
        <button id="start-btn" onclick="startSystem()" disabled>Cargar e Iniciar SO</button>
        <div id="status">Cargando motor de simulación...</div>
    </div>

    <div id="screen_container">
        <!-- Generamos el canvas y el div de texto explícitamente -->
        <canvas id="v86-canvas"></canvas>
        <div id="v86-text" style="white-space: pre; font-family: monospace; position: absolute; top:0; left:0; width:100%; height:100%;"></div>
    </div>

    <script>
        const isoInput = document.getElementById('iso-file');
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');

        window.addEventListener('load', () => {
            if (typeof V86Starter !== 'undefined') {
                statusDiv.innerText = "Motor listo. Por favor, selecciona un archivo .ISO";
                statusDiv.style.color = "#a6e3a1";
            } else {
                statusDiv.innerText = "Error: No se pudo cargar la librería del emulador.";
                statusDiv.style.color = "#f38ba8";
            }
        });

        isoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0 && typeof V86Starter !== 'undefined') {
                startBtn.disabled = false;
            }
        });

        function startSystem() {
            const file = isoInput.files[0];
            if (!file) return;

            startBtn.disabled = true;
            statusDiv.innerText = "Procesando archivo ISO...";

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const buffer = e.target.result;
                statusDiv.innerText = "Iniciando hardware virtual...";
                
                // Muestra la pantalla ANTES de iniciar el emulador para garantizar la existencia del Canvas
                const screenContainer = document.getElementById('screen_container');
                screenContainer.style.display = 'block';

                try {
                    const emulator = new V86Starter({
                        wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                        memory_size: 128 * 1024 * 1024,
                        vga_memory_size: 8 * 1024 * 1024,
                        screen_container: screenContainer,
                        canvas: document.getElementById("v86-canvas"),
                        bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                        vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                        cdrom: { buffer: buffer },
                        autostart: true
                    });

                    emulator.add_listener("emulator-ready", function() {
                        statusDiv.innerText = "¡Sistema iniciado! Haz clic dentro de la pantalla gráfica para interactuar.";
                        statusDiv.style.color = "#a6e3a1";
                    });

                } catch (err) {
                    statusDiv.innerText = "Error al iniciar el emulador: " + err.message;
                    statusDiv.style.color = "#f38ba8";
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
