<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impresor y Generador de Minilibros A4</title>

  <!-- Librerías para generación de PDF y compresión ZIP -->
  <script src="./Impresor y Generador de Minilibros A4_files/jspdf.umd.min.js"></script>
  <script src="./Impresor y Generador de Minilibros A4_files/html2canvas.min.js"></script>
  <script src="./Impresor y Generador de Minilibros A4_files/jszip.min.js"></script>

  <style>
    /* Estilos de la Interfaz */
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .toolbar {
      max-width: 1100px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="file"] { display: none; }

    select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background-color: #fff;
      cursor: pointer;
    }

    .btn {
      padding: 10px 18px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-select { background-color: #3b82f6; color: white; }
    .btn-select:hover { background-color: #2563eb; }

    .btn-print { background-color: #10b981; color: white; }
    .btn-print:hover { background-color: #059669; }

    .btn-zip { background-color: #8b5cf6; color: white; }
    .btn-zip:hover { background-color: #7c3aed; }

    .btn-merged { background-color: #ea580c; color: white; }
    .btn-merged:hover { background-color: #c2410c; }

    .btn:disabled {
      background-color: #9ca3af !important;
      cursor: not-allowed;
    }

    .info-text { font-size: 14px; color: #4b5563; }

    /* Estructura Hojas A4 */
    .print-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .hoja-a4 {
      width: 297mm;
      height: 210mm;
      background: white;
      padding: 5mm;
      box-sizing: border-box;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3mm;
      overflow: hidden;
      page-break-after: always;
    }

    /* Tarjetas */
    .card {
      border: 1.5px solid #0f172a;
      border-radius: 5px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 2px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .card-title {
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      text-transform: uppercase;
      margin: 0;
    }

    .page-num {
      font-weight: 800;
      color: #475569;
      white-space: nowrap;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    .card-content {
      color: #0f172a;
      text-align: left;
      font-weight: 500;
      width: 100%;
    }

    .card-content p { margin: 0; }

    .illustration {
      width: 64px;
      height: 64px;
      min-width: 64px;
      min-height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 2px;
      margin-top: 4px;
      align-self: center;
    }

    .illustration svg { width: 100%; height: 100%; }

    /* Tamaño de Letra */
    .font-sm .card-title { font-size: 13px; }
    .font-sm .page-num { font-size: 11px; }
    .font-sm .card-content { font-size: 13px; line-height: 1.25; }

    .font-md .card-title { font-size: 15px; }
    .font-md .page-num { font-size: 12px; }
    .font-md .card-content { font-size: 15px; line-height: 1.2; }

    .font-lg .card-title { font-size: 16.5px; }
    .font-lg .page-num { font-size: 13px; }
    .font-lg .card-content { font-size: 18px; line-height: 1.15; }

    /* Ajustes de Impresión */
    @media print {
      @page { size: A4 landscape; margin: 0; }
      body { background: none; padding: 0; }
      .toolbar { display: none !important; }
      .print-container { gap: 0; }
      .hoja-a4 { box-shadow: none; width: 297mm; height: 210mm; padding: 4mm; box-sizing: border-box; }
    }
  </style>
</head>
<body class="font-md">

  <div class="toolbar">
    <div class="control-group">
      <button class="btn btn-select" onclick="document.getElementById('fileInput').click()">
        📁 Cargar HTMLs
      </button>
      <input type="file" id="fileInput" accept=".html,.htm" multiple onchange="cargarHTMLs(event)">
      <span id="fileName" class="info-text">Ningún archivo cargado</span>
    </div>

    <div class="control-group">
      <label for="fontSizeSelect" class="info-text"><strong>Letra:</strong></label>
      <select id="fontSizeSelect" onchange="cambiarTamanoLetra(this.value)">
        <option value="font-sm">Pequeña (13px)</option>
        <option value="font-md" selected>Mediana (15px)</option>
        <option value="font-lg">Grande (18px)</option>
      </select>
    </div>
    
    <div class="control-group">
      <button id="btnPrint" class="btn btn-print" onclick="window.print()" disabled>🖨️ Imprimir A4</button>
      <button id="btnZip" class="btn btn-zip" onclick="descargarTodosZIP()" disabled>📦 Descargar ZIP (PDFs)</button>
      <button id="btnMerged" class="btn btn-merged" onclick="descargarPDFUnificado()" disabled>📕 PDF Único con Índice</button>
    </div>
  </div>

  <div id="printArea" class="print-container"></div>

  <script>
    let archivosProcesados = [];

    function cambiarTamanoLetra(claseFuente) {
      document.body.className = claseFuente;
    }

    function cargarHTMLs(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      archivosProcesados = [];
      document.getElementById('fileName').textContent = `${files.length} archivo(s) seleccionado(s)`;

      let lecturasCompletadas = 0;
      const printArea = document.getElementById('printArea');
      printArea.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(e.target.result, 'text/html');
          const cards = Array.from(doc.querySelectorAll('.card'));

          if (cards.length > 0) {
            archivosProcesados.push({
              nombre: file.name.replace(/\.[^/.]+$/, ""),
              cards: cards
            });
          }

          lecturasCompletadas++;
          if (lecturasCompletadas === files.length) {
            renderizarVistaPrevia();
          }
        };
        reader.readAsText(file);
      });
    }

    function renderizarVistaPrevia() {
      const printArea = document.getElementById('printArea');
      printArea.innerHTML = '';

      archivosProcesados.forEach(item => {
        const tarjetasPorHoja = 8;
        const totalHojas = Math.ceil(item.cards.length / tarjetasPorHoja);

        for (let i = 0; i < totalHojas; i++) {
          const hoja = document.createElement('div');
          hoja.className = 'hoja-a4';
          hoja.dataset.tema = item.nombre;

          const tarjetasGrupo = item.cards.slice(i * tarjetasPorHoja, (i + 1) * tarjetasPorHoja);
          
          tarjetasGrupo.forEach(card => {
            const cardClone = card.cloneNode(true);
            const body = cardClone.querySelector('.card-body');
            const content = cardClone.querySelector('.card-content');
            const illustration = cardClone.querySelector('.illustration');

            if (body && content && illustration) {
              body.innerHTML = '';
              body.appendChild(content);
              body.appendChild(illustration);
            }

            hoja.appendChild(cardClone);
          });

          printArea.appendChild(hoja);
        }
      });

      const deshabilitar = archivosProcesados.length === 0;
      document.getElementById('btnPrint').disabled = deshabilitar;
      document.getElementById('btnZip').disabled = deshabilitar;
      document.getElementById('btnMerged').disabled = deshabilitar;
    }

    async function descargarTodosZIP() {
      const btnZip = document.getElementById('btnZip');
      btnZip.disabled = true;
      btnZip.textContent = "⌛ Generando PDFs...";

      const { jsPDF } = window.jspdf;
      const zip = new JSZip();

      const temasMap = new Map();
      const hojas = document.querySelectorAll('.hoja-a4');

      hojas.forEach(hoja => {
        const nombreTema = hoja.dataset.tema;
        if (!temasMap.has(nombreTema)) {
          temasMap.set(nombreTema, []);
        }
        temasMap.get(nombreTema).push(hoja);
      });

      for (let [nombreTema, hojasTema] of temasMap.entries()) {
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        for (let i = 0; i < hojasTema.length; i++) {
          const hoja = hojasTema[i];
          const canvas = await html2canvas(hoja, { scale: 2, useCORS: true });
          const imgData = canvas.toDataURL('image/jpeg', 0.95);

          if (i > 0) pdf.addPage('a4', 'landscape');
          pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
        }

        const pdfBlob = pdf.output('blob');
        zip.file(`${nombreTema}.pdf`, pdfBlob);
      }

      btnZip.textContent = "📦 Comprimiendo ZIP...";
      const zipContent = await zip.generateAsync({ type: 'blob' });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipContent);
      link.download = 'minilibros_pdf.zip';
      link.click();

      btnZip.disabled = false;
      btnZip.textContent = "📦 Descargar ZIP (PDFs)";
    }

    async function descargarPDFUnificado() {
      const btnMerged = document.getElementById('btnMerged');
      btnMerged.disabled = true;
      btnMerged.textContent = "⌛ Generando PDF unido...";

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

      // 1. Ordenar los temas alfabéticamente
      const temasOrdenados = [...archivosProcesados].sort((a, b) => 
        a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
      );

      // 2. Mapear cada tema con las hojas que genera en el DOM
      const hojasDOM = Array.from(document.querySelectorAll('.hoja-a4'));
      const temasEstructurados = temasOrdenados.map(tema => {
        const hojasTema = hojasDOM.filter(hoja => hoja.dataset.tema === tema.nombre);
        return {
          nombre: tema.nombre,
          hojas: hojasTema
        };
      });

      // 3. Calcular en qué página del PDF estará cada tema (Página 1 es el Índice)
      let paginaActual = 2; // La página 1 estará reservada para el Índice
      const listaIndice = [];

      temasEstructurados.forEach(item => {
        listaIndice.push({
          nombre: item.nombre,
          paginaDestino: paginaActual
        });
        paginaActual += item.hojas.length;
      });

      // 4. Dibujar la primera página (ÍNDICE)
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(22);
      pdf.setTextColor(15, 23, 42); // #0f172a
      pdf.text("ÍNDICE DE TEMAS DE TEORÍA", 148.5, 25, { align: "center" });

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(11);
      pdf.setTextColor(100, 116, 139);
      pdf.text("Haz clic en cualquier tema para ir directamente a su sección", 148.5, 33, { align: "center" });

      // Dibujar línea separadora del título
      pdf.setDrawColor(203, 213, 225);
      pdf.setLineWidth(0.8);
      pdf.line(20, 38, 277, 38);

      // Posicionamiento de los elementos del Índice (2 columnas)
      let xCol1 = 25, xCol2 = 155;
      let yInicial = 48;
      let yOffset = yInicial;
      let altoLinea = 11;

      pdf.setFontSize(12);

      listaIndice.forEach((item, index) => {
        const esColumna2 = index >= Math.ceil(listaIndice.length / 2);
        if (index === Math.ceil(listaIndice.length / 2)) {
          yOffset = yInicial; // Reiniciar altura para la segunda columna
        }

        const xActual = esColumna2 ? xCol2 : xCol1;
        const anchoColumna = 115;

        // Texto del tema
        pdf.setFont("helvetica", "bold");
        pdf.setTextColor(37, 99, 235); // Color azul para dar aspecto de hipervínculo (#2563eb)
        
        let tituloAcortado = item.nombre;
        if (tituloAcortado.length > 40) {
          tituloAcortado = tituloAcortado.substring(0, 37) + "...";
        }
        
        pdf.text(tituloAcortado, xActual, yOffset);

        // Número de página
        pdf.setFont("helvetica", "normal");
        pdf.setTextColor(71, 85, 105);
        const textoPagina = `Pág. ${item.paginaDestino}`;
        pdf.text(textoPagina, xActual + anchoColumna, yOffset, { align: "right" });

        // Añadir el enlace clicable hacia la página destino
        pdf.link(xActual, yOffset - 5, anchoColumna, 7, { pageNumber: item.paginaDestino });

        // Línea punteada de guía entre el nombre del tema y la página
        pdf.setDrawColor(226, 232, 240);
        pdf.setLineWidth(0.3);
        pdf.line(xActual, yOffset + 3, xActual + anchoColumna, yOffset + 3);

        yOffset += altoLinea;
      });

      // 5. Renderizar cada hoja A4 e insertarla al PDF con su marca de posición
      for (let t = 0; t < temasEstructurados.length; t++) {
        const tema = temasEstructurados[t];

        for (let h = 0; h < tema.hojas.length; h++) {
          const hoja = tema.hojas[h];
          const canvas = await html2canvas(hoja, { scale: 2, useCORS: true });
          const imgData = canvas.toDataURL('image/jpeg', 0.95);

          pdf.addPage('a4', 'landscape');
          pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
        }
      }

      // 6. Descargar el archivo PDF final
      pdf.save('Teoria_Minilibros_Unificado.pdf');

      btnMerged.disabled = false;
      btnMerged.textContent = "📕 PDF Único con Índice";
    }
  </script>

</body>
</html>
