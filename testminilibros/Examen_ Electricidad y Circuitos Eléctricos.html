<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Electricidad y Circuitos Eléctricos</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-title">Examen: Electricidad y Circuitos Eléctricos (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Preguntas basadas estrictamente en Electricidad.html.
    // Las tres opciones de cada pregunta tienen exactamente la misma longitud o número de caracteres aproximado.
    const questionsData = [
      {
        question: "1. ¿Cuándo se produce específicamente la energía eléctrica?",
        options: [
          "Cuando los electrones externos viajan entre los átomos en materiales conductores.",
          "Cuando los protones del núcleo liberan energía térmica dentro de aislantes puros.",
          "Cuando las cargas positivas se congelan por completo en circuitos de bajo voltaje."
        ]
      },
      {
        question: "2. ¿Qué elementos constituyen un circuito eléctrico?",
        options: [
          "Generador de energía, conductores, receptores y elementos de control o seguridad.",
          "Exclusivamente fuentes de energía de corriente alterna y resistencias de protección.",
          "Únicamente receptores de alta potencia conectados a interruptores magnéticos."
        ]
      },
      {
        question: "3. ¿En qué consiste un relé dentro de un circuito?",
        options: [
          "Es un interruptor electromagnético activado desde un circuito auxiliar de control.",
          "Es un fusible térmico encargado de medir la intensidad total que circula en el cable.",
          "Es un generador magnético auxiliar que aporta tensión extra a los receptores finales."
        ]
      },
      {
        question: "4. ¿Cómo se comporta la intensidad en los circuitos en serie?",
        options: [
          "Todos los componentes del circuito comparten exactamente la misma intensidad.",
          "La corriente se reparte equitativamente entre las distintas ramas independientes.",
          "La intensidad aumenta proporcionalmente al número total de receptores instalados."
        ]
      },
      {
        question: "5. ¿Qué ocurre en un circuito en serie si falla un receptor?",
        options: [
          "Se interrumpe por completo el paso de la corriente eléctrica por todo el circuito.",
          "Los demás receptores continúan funcionando sin sufrir ninguna variación de tensión.",
          "La fuente compensa la falla aumentando automáticamente el caudal del flujo eléctrico."
        ]
      },
      {
        question: "6. ¿Cómo se instalan los receptores en un circuito en paralelo?",
        options: [
          "Se instalan conectados directamente en ramas totalmente independientes de la red.",
          "Se conectan uno a continuación del otro dentro de la misma línea del conductor.",
          "Se agrupan en un único bloque central aislando por completo el flujo de corriente."
        ]
      },
      {
        question: "7. ¿Qué voltaje reciben los receptores en una conexión en paralelo?",
        options: [
          "Todos los receptores conectados en paralelo reciben exactamente el mismo voltaje.",
          "El voltaje total suministrado se divide entre cada una de las ramas del circuito.",
          "La tensión cae progresivamente a medida que la corriente circula por el sistema."
        ]
      },
      {
        question: "8. ¿Qué es la carga eléctrica y en qué unidad se mide?",
        options: [
          "Es la cantidad de electricidad de un cuerpo y su unidad formal es el Culombio.",
          "Es el ritmo de consumo energético de un circuito y se expresa siempre en Watios.",
          "Es la resistencia al paso de electrones en el conductor y se mide en Ohmios."
        ]
      },
      {
        question: "9. ¿Cómo se define la intensidad y en qué unidad se expresa?",
        options: [
          "Es el caudal de electrones por segundo en el conductor y se mide en Amperios.",
          "Es la diferencia de potencial generada por la pila y se mide siempre en Voltios.",
          "Es la oposición que presenta el material al flujo eléctrico medida en Ohmios."
        ]
      },
      {
        question: "10. ¿De qué factores depende la resistencia de un material?",
        options: [
          "Depende de la longitud, la sección transversales y el tipo de material usado.",
          "Depende de la tensión del generador, la potencia consumida y la corriente fija.",
          "Depende del número de receptores, la frecuencia del circuito y el calor emitido."
        ]
      },
      {
        question: "11. ¿Cuál es la fórmula fundamental de la Ley de Ohm?",
        options: [
          "Establece que la Tensión equivale al producto de Resistencia por Intensidad (V = R · I).",
          "Establece que la Potencia equivale al producto de Voltaje por Intensidad (P = V · I).",
          "Establece que la Energía equivale al cociente de Tensión entre la Corriente (E = V / I)."
        ]
      },
      {
        question: "12. ¿Cómo se calcula la Potencia y cuál es su unidad?",
        options: [
          "Se calcula multiplicando la tensión por la corriente (P = V · I) y se mide en Watios.",
          "Se calcula dividiendo la resistencia entre la corriente (P = R / I) y se mide en Julios.",
          "Se calcula sumando la carga total al tiempo transcurrido (P = Q + t) y se mide en Voltios."
        ]
      },
      {
        question: "13. ¿Cómo debe conectarse un voltímetro para medir tensión?",
        options: [
          "Se instala obligatoriamente en paralelo con el receptor que se quiere medir.",
          "Se conecta en serie abriendo e interrumpiendo el cable principal del circuito.",
          "Se coloca entre el borne positivo y la toma de tierra del generador auxiliar."
        ]
      },
      {
        question: "14. ¿Cómo debe colocarse el amperímetro en el circuito?",
        options: [
          "Se instala en serie con los receptores, interrumpiendo el cable del circuito.",
          "Se conecta en paralelo al receptor para no alterar el paso de la corriente.",
          "Se ubica de forma inductiva sobre el aislante exterior sin tocar los conductores."
        ]
      },
      {
        question: "15. ¿Qué requisito exige medir resistencia con un ohmiómetro?",
        options: [
          "Exige comprobar previamente que el circuito esté totalmente desconectado.",
          "Exige mantener el circuito alimentado con la máxima tensión del generador.",
          "Exige conectar un voltímetro en serie para evitar cortocircuitos internos."
        ]
      },
      {
        question: "16. ¿Qué ventaja ofrece el uso del polímetro o multímetro?",
        options: [
          "Integra mediciones de tensión, corriente y resistencia en una sola rueda.",
          "Genera tensión continua regulada reemplazando la batería principal del sistema.",
          "Protege automáticamente los receptores frente a subidas bruscas de potencia."
        ]
      },
      {
        question: "17. ¿Qué relación fundamental establece el electromagnetismo?",
        options: [
          "El flujo eléctrico genera magnetismo y mover un campo magnético induce corriente.",
          "La corriente anula los campos magnéticos evitando la atracción en núcleos de hierro.",
          "Los polos magnéticos crean cargas eléctricas fijas sin necesidad de movimiento."
        ]
      },
      {
        question: "18. ¿Cómo se constituye un electroimán y cómo actúa?",
        options: [
          "Es una bobina por la que circula electricidad, actuando como imán temporal.",
          "Es un imán permanente de acero cubierto por una capa aislante de plástico.",
          "Es un circuito en serie sin receptor que convierte el voltaje en potencia pura."
        ]
      },
      {
        question: "19. ¿En qué se diferencia la dinamo del alternador?",
        options: [
          "La dinamo genera corriente continua con delgas en dos mitades separadas.",
          "La dinamo genera corriente alterna mediante escobillas fijas sin colector.",
          "El alternador produce corriente continua utilizando un núcleo magnético fijo."
        ]
      },
      {
        question: "20. ¿Qué función cumple el motor y cuáles son sus partes?",
        options: [
          "Transforma electricidad en rotación; consta de estator, rotor, colector y escobillas.",
          "Transforma movimiento mecánico en corriente; consta de fusibles, relé y batería.",
          "Transforma calor en energía eléctrica; consta de resistencias, inductor y conmutador."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
