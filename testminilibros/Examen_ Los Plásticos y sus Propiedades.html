<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Plásticos y Materiales Poliméricos</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-title">Examen: Los Plásticos y sus Propiedades (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Estructura con indicación explícita de la opción correcta
    const questionsData = [
      {
        question: "¿Cómo están estructurados químicamente los plásticos?",
        options: [
          { text: "Por macromoléculas llamadas polímeros compuestas por unidades de monómeros.", correct: true },
          { text: "Por átomos metálicos unidos mediante enlaces iónicos de alta resistencia.", correct: false },
          { text: "Por cristales minerales compactos organizados sin formar cadenas poliméricas.", correct: false }
        ]
      },
      {
        question: "¿Cuáles son las propiedades generales de los plásticos?",
        options: [
          { text: "Son ligeros, económicos, aislantes y muy resistentes a la corrosión química.", correct: true },
          { text: "Son pesados, muy conductores, caros y altamente reactivos a la humedad.", correct: false },
          { text: "Son frágiles, conductores térmicos, costosos y se oxidan rápidamente al aire.", correct: false }
        ]
      },
      {
        question: "¿De qué fuentes provienen los plásticos naturales?",
        options: [
          { text: "De materias primas vegetales o animales sin sufrir transformaciones complejas.", correct: true },
          { text: "De síntesis químicas artificiales elaboradas exclusivamente en laboratorio.", correct: false },
          { text: "De minerales metálicos extraídos directamente de las rocas tras su fusión.", correct: false }
        ]
      },
      {
        question: "¿Cuáles son ejemplos característicos de plásticos naturales?",
        options: [
          { text: "La celulosa, el celofán, la goma natural extraída de plantas y el látex.", correct: true },
          { text: "El PVC, el polietileno, la baquelita resistente y el poliuretano rígido.", correct: false },
          { text: "El nylon industrial, el teflón resistente, la melamina y la silicona.", correct: false }
        ]
      },
      {
        question: "¿A partir de qué materias primas se producen los plásticos sintéticos?",
        options: [
          { text: "A partir de derivados del petróleo, del gas natural y del carbón mineral.", correct: true },
          { text: "A partir de la celulosa vegetal extraída de los árboles y arbustos silvestres.", correct: false },
          { text: "A partir de látex de caucho virgen obtenido de los árboles tropicales.", correct: false }
        ]
      },
      {
        question: "¿Cómo se comportan los termoplásticos al aplicarles calor?",
        options: [
          { text: "Se reblandecen al calentarse y pueden moldearse repetidamente sin degradarse.", correct: true },
          { text: "Se destruyen y queman inmediatamente sin posibilidad de ablandamiento previo.", correct: false },
          { text: "Se endurecen permanentemente impidiendo cualquier cambio de forma posterior.", correct: false }
        ]
      },
      {
        question: "¿Cuáles son ejemplos característicos de materiales termoplásticos?",
        options: [
          { text: "El PVC, el PET, el poliestireno, el polipropileno y el polietileno común.", correct: true },
          { text: "La baquelita, la melamina, el poliuretano rígido y las resinas de poliéster.", correct: false },
          { text: "El caucho vulcanizado, la silicona líquida y la goma sintética elástica.", correct: false }
        ]
      },
      {
        question: "¿Qué estructura y comportamiento tienen los plásticos termoestables?",
        options: [
          { text: "Poseen redes cruzadas rígidas y si se recalientan se queman en vez de fundir.", correct: true },
          { text: "Tienen cadenas totalmente libres que permiten fundirlos de nuevo infinitas veces.", correct: false },
          { text: "Presentan una estructura elástica que recupera su forma tras dejar de estirar.", correct: false }
        ]
      },
      {
        question: "¿Cuáles de los siguientes materiales pertenecen a los termoestables?",
        options: [
          { text: "El poliuretano, la melamina, la baquelita, las resinas y las siliconas.", correct: true },
          { text: "El celofán, la celulosa vegetal, el látex natural y la goma de resina.", correct: false },
          { text: "El polietileno de alta densidad, el PVC transparente y el PET ligero.", correct: false }
        ]
      },
      {
        question: "¿Qué característica distingue principalmente a los elastómeros?",
        options: [
          { text: "Tienen gran elasticidad y recuperan su forma original tras cesar la fuerza.", correct: true },
          { text: "Son materiales totalmente rígidos incapaces de deformarse sin romperse.", correct: false },
          { text: "Se funden fácilmente a bajas temperaturas para moldearse como líquidos.", correct: false }
        ]
      },
      {
        question: "¿Qué efecto tiene el proceso de vulcanización con azufre en los elastómeros?",
        options: [
          { text: "Mejora notablemente su dureza, su elasticidad y su resistencia a los químicos.", correct: true },
          { text: "Convierte el plástico en un material termoplástico fácil de reciclar por calor.", correct: false },
          { text: "Destruye totalmente la flexibilidad del polímero convirtiéndolo en ceniza.", correct: false }
        ]
      },
      {
        question: "¿En qué consiste exactamente el proceso industrial de extrusión?",
        options: [
          { text: "Empuja el plástico fundido con un tornillo sinfín a través de una boquilla.", correct: true },
          { text: "Hace pasar el material caliente entre rodillos giratorios para hacer láminas.", correct: false },
          { text: "Succiona el aire del molde para pegar una lámina plástica a las paredes.", correct: false }
        ]
      },
      {
        question: "¿Cómo se define el proceso de calandrado de plásticos?",
        options: [
          { text: "Hace pasar el material plástico entre rodillos giratorios para obtener láminas.", correct: true },
          { text: "Inyecta aire a presión dentro de un tubo caliente para expandirlo en el molde.", correct: false },
          { text: "Introduce plástico a gran presión dentro de moldes metálicos totalmente fríos.", correct: false }
        ]
      },
      {
        question: "¿Cómo funciona la técnica de moldeo por soplado?",
        options: [
          { text: "Inyecta aire a presión dentro de un tubo caliente para expandirlo en el molde.", correct: true },
          { text: "Prensa gránulos de plástico caliente entre dos matrices hasta lograr su curado.", correct: false },
          { text: "Empuja el material fundido mediante un tornillo giratorio hasta la boquilla.", correct: false }
        ]
      },
      {
        question: "¿En qué consiste el conformado a vacío en plásticos?",
        options: [
          { text: "Succiona el aire para pegar una lámina plástica a las paredes del molde.", correct: true },
          { text: "Introduce plástico líquido a gran presión dentro de moldes cerrados y fríos.", correct: false },
          { text: "Calienta el plástico con vapor de agua hasta expandir su volumen original.", correct: false }
        ]
      },
      {
        question: "¿Cómo se ejecuta el procedimiento de moldeo por inyección?",
        options: [
          { text: "Introduce plástico líquido a gran presión dentro de moldes fríos y cerrados.", correct: true },
          { text: "Prensa gránulos de plástico caliente entre dos matrices hasta su curado total.", correct: false },
          { text: "Inyecta aire comprimido para expandir una botella dentro de su matriz previa.", correct: false }
        ]
      },
      {
        question: "¿Cómo se realiza el moldeo por compresión?",
        options: [
          { text: "Prensa gránulos de plástico caliente entre dos matrices hasta lograr su curado.", correct: true },
          { text: "Succiona el aire mediante bombas de vacío para adherir láminas finas al molde.", correct: false },
          { text: "Empuja el plástico fluido con un tornillo sinfín para fabricar tubos continuos.", correct: false }
        ]
      },
      {
        question: "¿Qué requerimiento exige el mecanizado correcto de los plásticos?",
        options: [
          { text: "Adaptar la velocidad y refrigerar la zona para evitar que el material se funda.", correct: true },
          { text: "Calentar el material a altas temperaturas antes de aplicar la broca de corte.", correct: false },
          { text: "Aplicar fuerzas extremas con herramientas secas sin controlar el calor generado.", correct: false }
        ]
      },
      {
        question: "¿Cómo se identifican los plásticos para su reciclaje según el sistema RIC?",
        options: [
          { text: "Mediante números del 1 al 7 ubicados dentro de un triángulo formado por flechas.", correct: true },
          { text: "Mediante letras del alfabeto impresas en el interior de un círculo metálico.", correct: false },
          { text: "Mediante un código numérico del 1 al 10 grabado en un marco de forma cuadrada.", correct: false }
        ]
      },
      {
        question: "¿Qué beneficio ambiental aporta el reciclaje de plásticos?",
        options: [
          { text: "Permite triturarlos y reutilizarlos, reduciendo residuos y el consumo de petróleo.", correct: true },
          { text: "Elimina por completo las emisiones de carbono en las industrias de fabricación.", correct: false },
          { text: "Transforma los polímeros sintéticos en compuestos orgánicos biodegradables.", correct: false }
        ]
      }
    ];

    // Algoritmo de aleatorización Fisher-Yates
    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = array.map(item => ({ ...item }));
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';

      // Limpiar celdas de la tabla de respuestas y mensaje de evaluación
      for(let i = 1; i <= 20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      // 1. Aleatorizar PREGUNTAS
      const shuffledQuestions = shuffle(questionsData);

      shuffledQuestions.forEach((qItem, qIndex) => {
        const qNum = qIndex + 1;
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        qTitle.innerText = `${qNum}. ${qItem.question}`;
        questionCard.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        // 2. Aleatorizar RESPUESTAS dentro de cada pregunta
        const shuffledOptions = shuffle(qItem.options);

        shuffledOptions.forEach((optObj, optIndex) => {
          const letter = ['a', 'b', 'c'][optIndex];

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;
          inputRadio.dataset.correct = optObj.correct;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optObj.text}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.dataset.correct === "true") {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    // Se ejecuta al cargar o recargar la página
    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
