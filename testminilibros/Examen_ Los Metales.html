<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Materiales de Construcción: Los Metales - Citas Literales</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON PLANTILLA DE RESPUESTAS Y DATOS -->
  <div class="header-container">
    <div class="header-title">Examen: Los Metales (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <!-- TABLA DE RESPUESTAS RÁPIDAS PARA CORRECCIÓN -->
    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <!-- CONTENEDOR DEL TEST EN 2 COLUMNAS -->
  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Preguntas con respuestas sacadas LITERALMENTE del texto de Metales.html
    // La opción en el índice 0 es siempre la respuesta correcta literal.
    const questionsData = [
      {
        question: "1. ¿Cómo se definen los metales y cuál es la excepción a su estado sólido a temperatura ambiente?",
        options: [
          "Elementos conductores de calor y electricidad, de alta densidad y sólidos a temperatura ambiente, salvo el mercurio. Incluye metales puros y aleaciones.",
          "Sustancias aislantes de calor y magnetismo, de baja densidad y líquidas a temperatura ambiente, salvo el aluminio. Incluye plásticos y resinas.",
          "Compuestos porosos de escasa dureza que se evaporan a temperatura ambiente, salvo el platino. Incluye vidrios y cerámicas avanzadas."
        ]
      },
      {
        question: "2. ¿Cómo ha evolucionado la utilización histórica de los metales?",
        options: [
          "Tras usarse oro, plata y cobre nativos, surgió el bronce. El hierro avanzó con los hornos de fuelle y luego con la producción industrial de acero.",
          "Tras usarse únicamente titanio y mercurio líquido, surgió el aluminio. El zinc avanzó con los molinos hidráulicos y luego con las fibras sintéticas.",
          "Tras usarse hierro macizo de forma exclusiva, surgió el plomo puro. El cobre avanzó con las prensas de vapor y luego con el uso de plásticos rígidos."
        ]
      },
      {
        question: "3. ¿Qué propiedades mecánicas y físicas caracterizan a los metales?",
        options: [
          "Tienen brillo, opacidad y alta fusibilidad. Destacan por su maleabilidad (láminas), ductilidad (hilos), tenacidad a impactos y resistencia mecánica.",
          "Tienen transparencia, porosidad y nula fusibilidad. Destacan por su fragilidad extrema (láminas), rigidez absoluta (hilos) y baja densidad.",
          "Tienen textura rugosa, elasticidad gaseosa y baja ductilidad. Destacan por su flotabilidad (láminas), fragilidad térmica y aislamiento magnético."
        ]
      },
      {
        question: "4. ¿Cómo se encuentran los metales en la naturaleza y cómo se extraen?",
        options: [
          "Se hallan libres o en óxidos y sulfuros. Se extraen mediante minas a cielo abierto en superficie o subterráneas por pozos y galerías.",
          "Se hallan disueltos exclusivamente en agua dulce. Se extraen mediante condensación atmosférica directa o por filtrado de vegetación.",
          "Se hallan dentro de la celulosa vegetal del tronco. Se extraen mediante el cepillado mecánico de superficies y secado al sol."
        ]
      },
      {
        question: "5. ¿Qué características destacan del aluminio y en qué categorías se dividen los metales?",
        options: [
          "Se dividen en ligeros y pesados, o férricos y no férricos. El aluminio (de bauxita) es muy ligero, resistente a corrosión y buen conductor.",
          "Se dividen en plásticos y cristalinos, o maleables y rígidos. El aluminio (de galena) es muy denso, propenso a la oxidación y aislando.",
          "Se dividen en sintéticos y naturales, o blandos y líquidos. El aluminio (de magnetita) es muy frágil, pesado y de bajo punto de fusión."
        ]
      },
      {
        question: "6. ¿Cuáles son las propiedades y aplicaciones del cobre y del bronce?",
        options: [
          "El cobre es gran conductor eléctrico e ideal para cables. El bronce (cobre y estaño) aporta dureza para estatuas, llaves y engranajes.",
          "El cobre es un aislante térmico ideal para bancadas. El bronce (cobre y zinc) aporta ligereza extrema para envases y papel de embalar.",
          "El cobre es frágil y de baja fusibilidad para arquetas. El bronce (hierro y cromo) aporta flexibilidad para tubos flexibles de agua."
        ]
      },
      {
        question: "7. ¿Qué propiedades presentan el plomo y el latón?",
        options: [
          "El plomo es pesado, blando y de bajo punto de fusión. El latón (cobre y zinc) destaca por su fácil moldeo y uso en grifos y tornillería.",
          "El plomo es ligero, muy duro y de alto punto de fusión. El latón (plomo y estaño) destaca por su fragilidad y uso en estructuras masivas.",
          "El plomo es magnético, dúctil y transparente. El latón (aluminio y cromo) destaca por su difícil moldeo y uso en cables de alta tensión."
        ]
      },
      {
        question: "8. ¿Qué características distinguen al oro, la plata y el platino?",
        options: [
          "El oro es inerte y dúctil para joyería y chips. La plata lidera en conductividad. El platino resiste la corrosión en catalizadores de coches para contaminar menos.",
          "El oro es oxidable y frágil para vigas. La plata lidera en aislamiento térmico. El platino resiste la fricción en rodamientos de madera tratada.",
          "El oro es magnético para motores eléctricos. La plata lidera en dureza estructural. El platino resiste la humedad en componentes de fontanería."
        ]
      },
      {
        question: "9. ¿Cómo se obtiene el acero o la fundición a partir del hierro?",
        options: [
          "Metal magnético y denso que domina la industria. Reducido con carbono( eliminar el oxígeno atrapado) produce acero (menos de 2% C) o fundición (más de 2% C).",
          "Metal blando y ligero que flota en agua. Aleado con azufre produce acero (más de 5% C) o fundición (menos de 0,5% C) sin usar calor.",
          "Metal transparente e inerte que repele imanes. Mezclado con silicio produce acero (exactamente 10% C) o fundición sintética."
        ]
      },
      {
        question: "10. ¿Qué propiedades tienen los aceros y cómo se obtiene el acero inoxidable?",
        options: [
          "Aleaciones tenaces, dúctiles y soldables. El acero inoxidable añade cromo para evitar la corrosión al afinar el arrabio con oxígeno.",
          "Aleaciones frágiles, rígidas e insolubles. El acero inoxidable añade plomo para acelerar la oxidación al afinar el mineral con nitrógeno.",
          "Aleaciones blandas, ligeras y porosas. El acero inoxidable añade zinc para aumentar el magnetismo al enfriar el hierro con agua."
        ]
      },
      {
        question: "11. ¿Cuáles son las características de las fundiciones y en qué horno se procesan?",
        options: [
          "Aleaciones férreas duras pero frágiles, con alto carbono. Se procesan en hornos cubilete para fabricar bancadas, motores y arquetas.",
          "Aleaciones no férricas blandas y elásticas, sin carbono. Se procesan en hornos de vacío para fabricar cables finos y láminas.",
          "Aleaciones ligeras de bajo punto de fusión, con cromo. Se procesan en hornos rotativos para fabricar joyas y chips electrónicos."
        ]
      },
      {
        question: "12. ¿En qué consisten los procesos de moldeo y mecanizado de metales?",
        options: [
          "Incluye la fundición vertida en moldes de arena o a presión, y el mecanizado por taladrado con brocas o fresado rotativo.",
          "Incluye la congelación de metales líquidos en moldes de papel, y el mecanizado por estirado en frío con tenazas manuales.",
          "Incluye la mezcla de minerales secos en recipientes de madera, y el mecanizado por inmersión en baños químicos abrasivos."
        ]
      },
      {
        question: "13. ¿Qué diferencia las técnicas de forja y troquelado?",
        options: [
          "La forja moldea el metal con impactos en frío o caliente. El troquelado corta y estampa chapas usando matrices a alta presión.",
          "La forja vierte el metal líquido sobre arena fina. El troquelado une piezas metálicas mediante adhesivos químicos de secado rápido.",
          "La forja desgasta la superficie mediante lija fina. El troquelado taladra orificios cilíndricos usando brocas helicoidales."
        ]
      },
      {
        question: "14. ¿Qué herramientas manuales y portátiles se utilizan para trazar, cortar y ajustar metales?",
        options: [
          "Se traza con regla, punta y compás metálico. Para cortar, perforar y ajustar se usan tijeras de chapa, limas, seguetas y taladros.",
          "Se traza con lápiz blando y tiza húmeda. Para cortar, perforar y ajustar se usan cepillos de carpintero, escofinas y mallas.",
          "Se traza con alambres de cobre fino. Para cortar, perforar y ajustar se usan martillos de madera, mangueras de agua y barrenas."
        ]
      },
      {
        question: "15. ¿De qué mineral se extrae principalmente el aluminio?",
        options: [
          "El aluminio (de bauxita) es muy ligero, resistente a corrosión y buen conductor.",
          "El aluminio (de galena) es muy pesado, blando y de bajo punto de fusión.",
          "El aluminio (de magnetita) es magnético y de alta resistencia a la tracción."
        ]
      },
      {
        question: "16. ¿Qué componentes forman la aleación conocida como latón?",
        options: [
          "El latón (cobre y zinc) destaca por su fácil moldeo y uso en grifos y tornillería.",
          "El latón (cobre y estaño) aporta dureza para estatuas, llaves y engranajes.",
          "El latón (hierro y carbono) produce estructuras para la edificación."
        ]
      },
      {
        question: "17. ¿Por qué se añade cromo al fabricar acero inoxidable?",
        options: [
          "El acero inoxidable añade cromo para evitar la corrosión al afinar el arrabio con oxígeno.",
          "El acero inoxidable añade cromo para reducir la densidad y hacerlo flotante en agua.",
          "El acero inoxidable añade cromo para bajar su punto de fusión a temperatura ambiente."
        ]
      },
      {
        question: "18. ¿Para qué aplicación específica destaca el uso del platino?",
        options: [
          "El platino resiste la corrosión en catalizadores de coches para contaminar menos.",
          "El platino se utiliza para el trazado con regla, punta y compás metálico.",
          "El platino se procesa en hornos cubilete para fabricar bancadas y arquetas."
        ]
      },
      {
        question: "19. ¿Qué porcentaje de carbono diferencia principalmente al acero de la fundición?",
        options: [
          "produce acero (menos de 2% C) o fundición (más de 2% C).",
          "produce acero (más de 10% C) o fundición (menos de 0,1% C).",
          "produce acero (exactamente 50% C) o fundición (sin presencia de carbono)."
        ]
      },
      {
        question: "20. ¿Qué herramienta se utiliza para el trazado sobre metales?",
        options: [
          "Se traza con regla, punta y compás metálico.",
          "Se traza con escofina, cepillo y broca helicoidal.",
          "Se traza con broca de diamante y mazo de madera."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
