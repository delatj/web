<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Ciberseguridad - Ajustado a 2 Páginas</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON PLANTILLA DE RESPUESTAS Y DATOS -->
  <div class="header-container">
    <div class="header-title">Examen de Ciberseguridad: Conceptos Clave (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <!-- TABLA DE RESPUESTAS RÁPIDAS PARA CORRECCIÓN -->
    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <!-- CONTENEDOR DEL TEST EN 2 COLUMNAS -->
  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // BBDD con las 20 preguntas. La primera opción (index 0) es SIEMPRE la correcta literal.
    const questionsData = [
      {
        question: "1. ¿Cómo se define formalmente la ciberseguridad según la teoría?",
        options: [
          "disciplina que se ocupa de proteger sistemas, redes y programas de ataques digitales, daños o acceso no autorizado.",
          "conjunto de normativas legales para sancionar los delitos informáticos en entornos virtuales globales.",
          "herramienta informática destinada a monitorizar el tráfico web y bloquear aplicaciones peligrosas."
        ]
      },
      {
        question: "2. ¿Cuál es la finalidad principal descrita al aplicar ciberseguridad?",
        options: [
          "garantizar la confidencialidad, integridad y disponibilidad de la información en entornos virtuales.",
          "incrementar la velocidad de procesamiento y almacenamiento dentro de las plataformas institucionales.",
          "evitar cualquier tipo de interacción de los usuarios con servidores externos no verificados."
        ]
      },
      {
        question: "3. ¿Qué caracteriza a la seguridad activa dentro de las medidas?",
        options: [
          "Medidas previas que previenen y protegen contra amenazas. Ejemplos incluyen firewalls y antivirus.",
          "Respuestas inmediatas ante incidentes graves que ya han afectado al sistema de la organización.",
          "Evaluaciones continuas sobre los datos extraviados para proceder a su posterior restauración."
        ]
      },
      {
        question: "4. ¿Cómo define el libro la seguridad pasiva?",
        options: [
          "Medidas reactivas que responden después de que se ha producido una amenaza, como copias de seguridad.",
          "Estrategias diseñadas para bloquear las conexiones entrantes sospechosas antes de ingresar.",
          "Protocolos automáticos que sustituyen el uso de contraseñas por identificación biométrica."
        ]
      },
      {
        question: "5. ¿A qué se refiere la exposición de los usuarios?",
        options: [
          "hace referencia al grado en que están expuestos a amenazas cibernéticas por contraseñas débiles o malas prácticas.",
          "al tiempo máximo que un estudiante pasa conectado a internet durante las sesiones lectivas.",
          "a la visibilidad pública que tienen los datos personales en los motores de búsqueda abiertos."
        ]
      },
      {
        question: "6. ¿Qué abarca la categoría de peligros en el libro?",
        options: [
          "abarcan virus, malware, phishing y robo de identidad.",
          "abarcan fallos de hardware, problemas de cobertura y pérdidas de señal.",
          "abarcan el uso indebido de licencias corporativas y copias ilegales."
        ]
      },
      {
        question: "7. ¿Cómo se comporta un virus según la clasificación de malware?",
        options: [
          "se adjuntan a programas legítimos.",
          "se oculta dentro de imágenes adjuntas en correos sin requerir interacción.",
          "se encarga de cifrar el disco duro solicitando pagos en moneda virtual."
        ]
      },
      {
        question: "8. ¿Cuál es el comportamiento específico de los gusanos?",
        options: [
          "se replican automáticamente por la red.",
          "modifican el código fuente del sistema operativo para desactivar el cortafuegos.",
          "engañan al usuario ofreciendo programas de optimización y limpieza gratuita."
        ]
      },
      {
        question: "9. ¿De qué manera actúan los troyanos en el sistema?",
        options: [
          "se disfrazan de software legítimo",
          "solicitan un rescate económico inmediato tras bloquear la pantalla.",
          "duplican archivos adjuntos de forma incontrolada hasta llenar la memoria."
        ]
      },
      {
        question: "10. ¿Cuál es la función destructiva del ransomware?",
        options: [
          "encripta archivos para exigir un rescate económico.",
          "elimina permanentemente los controladores de red del equipo.",
          "extrae contraseñas almacenadas en el navegador de internet."
        ]
      },
      {
        question: "11. ¿Cómo describe el libro la técnica del phishing?",
        options: [
          "una técnica de ingeniería social para engañar a las personas y obtener información confidencial como contraseñas.",
          "un software maligno instalado en el sector de arranque del disco duro informático.",
          "un protocolo de red no seguro que expone la dirección IP de los usuarios interconectados."
        ]
      },
      {
        question: "12. ¿Qué utilidad tiene el antimalware en el equipo?",
        options: [
          "abarca programas diseñados para detectar y eliminar este software malicioso.",
          "permite recuperar ficheros eliminados tras un formateo accidental del sistema.",
          "gestiona las conexiones Wi-Fi públicas para garantizar una navegación cifrada."
        ]
      },
      {
        question: "13. ¿Qué acción se recomienda en plataformas virtuales?",
        options: [
          "Es importante configurar los perfiles en redes sociales y aplicaciones.",
          "Desactivar la sincronización remota para ahorrar espacio en la nube corporativa.",
          "Modificar la dirección de correo electrónico al menos una vez al mes por seguridad."
        ]
      },
      {
        question: "14. ¿Qué mecanismos protegen la interacción en plataformas?",
        options: [
          "autenticación de dos factores, cifrado de datos y actualizaciones regulares para proteger la interacción.",
          "uso de contraseñas cortas fáciles de recordar e historiales de navegación limpios.",
          "instalación de múltiples programas antivirus trabajando de manera simultánea."
        ]
      },
      {
        question: "15. ¿Qué marco legal se menciona para el ámbito digital?",
        options: [
          "Las leyes protegen derechos de autor en el ámbito digital.",
          "Los acuerdos internacionales garantizan la libre descarga de contenidos educativos.",
          "Las normativas europeas prohíben el registro de datos en aplicaciones de aprendizaje."
        ]
      },
      {
        question: "16. ¿Qué implica un material sin indicación o con copyright?",
        options: [
          "implica automáticamente que tiene derechos reservados y no podemos utilizarlo sin permiso.",
          "permite su uso libre siempre que no exista una ganancia económica directa.",
          "indica que se trata de un recurso compartido disponible para ser modificado."
        ]
      },
      {
        question: "17. ¿Qué se facilita mediante las licencias abiertas?",
        options: [
          "licencias abiertas como Creative Commons podemos usar el material respetando sus condiciones",
          "licencias abiertas cualquier usuario puede comercializar obras de terceros sin limitaciones.",
          "licencias abiertas se elimina la obligación de citar la autoría original de los recursos."
        ]
      },
      {
        question: "18. ¿Cuáles son las siglas en las licencias Creative Commons?",
        options: [
          "BY (Atribución), SA (Compartir Igual), NC (No Comercial) y ND (Sin Obra Derivada).",
          "CP (Copia Permitida), RE (Reuso), MD (Modificación) y PA (Pago Autorizado).",
          "OP (Open Source), GL (General Public), CC (Creative Commons) y DR (Derechos)."
        ]
      },
      {
        question: "19. ¿Qué pasa en las licencias de dominio público?",
        options: [
          "Los derechos patrimoniales del autor ya no existen.",
          "Ocurre igual con los recursos de prueba temporal.",
          "Ocurre igual con el contenido de redes sociales."
        ]
      },
      {
        question: "20. ¿Qué soluciones protegen el acceso a los perfiles en Internet como correo?",
        options: [
          "soluciones involucran el uso de autenticación de dos factores",
          "soluciones se centran en borrar la memoria caché diariamente",
          "soluciones consisten en desinstalar aplicaciones sin uso constante"
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      // Limpiar tabla de respuestas
      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        // Preparamos opciones desordenadas
        const correctText = qItem.options[0]; // La literal
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          // Guardar cuál es la letra correcta para esta pregunta
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          // Evento al marcar una opción: actualiza la tabla de corrección superior
          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = correctCount >= 10 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = correctCount >= 10 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${correctCount >= 10 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${(correctCount / 2).toFixed(1)} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
