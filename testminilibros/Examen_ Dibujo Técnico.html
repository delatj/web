<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Dibujo Técnico - Citas Literales</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON PLANTILLA DE RESPUESTAS Y DATOS -->
  <div class="header-container">
    <div class="header-title">Examen: Dibujo Técnico (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <!-- TABLA DE RESPUESTAS RÁPIDAS PARA CORRECCIÓN -->
    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <!-- CONTENEDOR DEL TEST EN 2 COLUMNAS -->
  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Preguntas con respuestas sacadas LITERALMENTE del texto de Dibujo.html
    // La opción en el índice 0 es siempre la respuesta correcta literal.
    const questionsData = [
      {
        question: "1. ¿En qué consiste dibujar y cómo se divide?",
        options: [
          "Dibujar consiste en trazar las líneas de una figura o pieza. Se divide en dibujo a mano alzada, realizado sin apoyar la mano, y dibujo lineal, que utiliza instrumentos geométricos.",
          "Dibujar consiste en colorear las superficies de una maqueta. Se divide en dibujo técnico industrial, realizado por ordenador, y dibujo artístico tradicional en acuarela.",
          "Dibujar consiste en modelar figuras tridimensionales. Se divide en dibujo de bocetos rápidos en papel y dibujo definitivo trazado exclusivamente sobre planos digitales."
        ]
      },
      {
        question: "2. ¿Cómo se define el Dibujo Técnico?",
        options: [
          "Es un sistema de representación gráfica guiado por normas fijas para aportar información exacta y clara que facilite el diseño, análisis, construcción y mantenimiento de objetos.",
          "Es una forma de expresión libre orientada a transmitir sensaciones y estética sin requerir la medición exacta ni el uso de normativas mecánicas normalizadas.",
          "Es un método simplificado de pintura esquemática que busca ilustrar la historia de los objetos sin detallar sus medidas ni su proceso de fabricación industrial."
        ]
      },
      {
        question: "3. ¿Qué es y cómo se realiza el croquis?",
        options: [
          "El croquis es un diseño abocetado que plasma de forma simplificada una imagen o idea. Se realiza habitualmente a mano alzada, sin elementos técnicos y a partir de la imaginación o modelo.",
          "El croquis es un plano definitivo a escala exacta. Se realiza habitualmente con reglas calibradas, compás de precisión y sobre papel vegetal de alto gramaje.",
          "El croquis es una proyección ortogonal en tres dimensiones. Se realiza habitualmente con programas informáticos de diseño asistido para calcular costes de producción."
        ]
      },
      {
        question: "4. ¿Qué es el plano y qué instrumentos exige?",
        options: [
          "Es la representación esquemática en dos dimensiones y a escala de objetos, piezas o construcciones. Se traza con instrumentos precisos como reglas, escuadras y cartabones.",
          "Es el dibujo preliminar sin medidas trazado directamente a mano alzada. Se traza con instrumentos básicos como lápices de colores suaves y borradores flexibles.",
          "Es la maqueta tridimensional reducida de una obra terminada. Se traza con instrumentos mecánicos de corte, reglas graduadas de madera y herramientas de ensamblaje."
        ]
      },
      {
        question: "5. ¿Qué indica la escala y en qué unidad suelen expresarse sus dimensiones?",
        options: [
          "Indica la relación de proporción entre las medidas del dibujo y las reales del objeto. Las dimensiones suelen expresarse en milímetros para garantizar la máxima exactitud en el diseño.",
          "Indica la inclinación en grados de las vistas laterales de una pieza. Las dimensiones suelen expresarse en centímetros para simplificar la lectura del boceto inicial.",
          "Indica la masa total y densidad de los materiales del objeto. Las dimensiones suelen expresarse en metros para estandarizar la producción gráfica en el taller."
        ]
      },
      {
        question: "6. ¿Cuáles son las características angulares de la escuadra y el cartabón?",
        options: [
          "La escuadra es isósceles (90º, 45º, 45º) y el cartabón es escaleno (90º, 30º, 60º). Se combinan para trazar paralelas, perpendiculares e inclinadas.",
          "La escuadra es escalena (90º, 30º, 60º) y el cartabón es isósceles (90º, 45º, 45º). Se combinan para medir arcos de circunferencia y radios de curbatura.",
          "La escuadra es equilátera (60º, 60º, 60º) y el cartabón es rectángulo (90º, 20º, 70º). Se combinan para marcar cotas auxiliares e inclinaciones del terreno."
        ]
      },
      {
        question: "7. ¿Cómo actúa el sistema diédrico para representar el espacio?",
        options: [
          "Método de representación geométrica que reduce el espacio tridimensional al plano bidimensional mediante proyecciones ortogonales sobre dos planos perpendiculares que se abaten.",
          "Método de ilustración artística que simula la profundidad espacial mediante la convergencia de líneas paralelas en un único punto de fuga central del papel.",
          "Método de diseño asistido que proyecta imágenes oblicuas directamente sobre un cuerpo cilíndrico sin requerir el abatimiento de los planos de corte."
        ]
      },
      {
        question: "8. ¿Cómo se representan las aristas visibles y ocultas en las vistas de un objeto?",
        options: [
          "Las aristas visibles se dibujan en línea continua ancha y las aristas ocultas con línea discontinua.",
          "Las aristas visibles se dibujan en línea discontinua fina y las aristas ocultas con línea continua roja.",
          "Las aristas visibles se dibujan con trazado a trazos cortos y las aristas ocultas con puntos alternados."
        ]
      },
      {
        question: "9. ¿En qué consiste la acotación?",
        options: [
          "Consiste en representar las dimensiones reales y características de un objeto mediante líneas, cifras y símbolos, proporcionando los datos necesarios para su fabricación.",
          "Consiste en dibujar a escala reducida los planos del alzado, la planta y el perfil de una figura sin incluir los valores numéricos directos del diseño.",
          "Consiste en sombrear las caras externas de un plano tridimensional para indicar la procedencia de la luz y el tipo de textura del material."
        ]
      },
      {
        question: "10. ¿Qué elementos componen la acotación de una pieza?",
        options: [
          "Incluye líneas de cota (con flechas en los extremos), líneas auxiliares de cota perpendiculares a las anteriores y las cotas o cifras que indican la dimensión del objeto.",
          "Incluye flechas de dirección de corte, ejes de simetría discontinuos y anotaciones al margen con las explicaciones teóricas de los materiales utilizados.",
          "Incluye la escala gráfica del plano, el rotulo del título con los nombres de los autores y el indicador de los grados del sistema diédrico."
        ]
      },
      {
        question: "11. ¿Qué símbolos acompañan a las medidas de acotación para marcar formas específicas?",
        options: [
          "el diámetro (Ø), radio (R), además del diámetro esférico (SØ) y el radio esférico (SR).",
          "la altura (h), el perímetro (P), además de la cota máxima (Cmax) y la cota mínima (Cmin).",
          "el ángulo (∠), la pendiente (S), el grosor (G), además del volumen total (V) y la superficie exterior (A)."
        ]
      },
      {
        question: "12. ¿Qué instrumentos destacan para la medición de longitudes?",
        options: [
          "Destacan el metro plegable rígido, el flexómetro metálico enrollable, la cinta métrica para grandes distancias y la regla graduada rígida.",
          "Destacan el micrómetro digital de precisión, el transportador de ángulos, el escantillón y el compás de puntas secas.",
          "Destacan el pie de rey con nomio, el calibre de profundidad, el pirómetro térmico y la plomada de obra en carpintería."
        ]
      },
      {
        question: "13. ¿Qué es el goniómetro y cuál es su grado de graduación habitual?",
        options: [
          "También conocido como transportador de ángulos. Es un semicírculo o círculo graduado en 180º o 360º empleado para medir y construir ángulos de forma precisa.",
          "También conocido como regla graduada. Es una barra metálica dividida en 100 o 1000 milímetros empleada para trazar rectas paralelas horizontales.",
          "También conocido como compás de corte. Es una varilla articulada con graduación de 0 a 90 milímetros empleada para verificar arcos de circunferencia."
        ]
      },
      {
        question: "14. ¿Cómo mide piezas el calibre o pie de rey y qué elementos especiales incluye?",
        options: [
          "Mide piezas pequeñas con precisión mediante el nonio (fracciones de mm). Cuenta con piezas especiales superiores y un extremo para medir diámetros interiores y profundidades.",
          "Mide grandes distancias mediante una cinta metálica flexible graduada. Cuenta con pivotes inferiores especiales para calcular la densidad y el peso de las piezas.",
          "Mide ángulos obtusos e agudos mediante una escala semicircular. Cuenta con dos reglas articuladas de madera para comprobar la alineación de las aristas del plano."
        ]
      },
      {
        question: "15. ¿Qué diferencia al dibujo a mano alzada del dibujo lineal?",
        options: [
          "El dibujo a mano alzada se realiza sin apoyar la mano, mientras que el dibujo lineal utiliza instrumentos geométricos.",
          "El dibujo a mano alzada utiliza reglas calibradas y cartabones, mientras que el dibujo lineal requiere exclusivamente ordenador.",
          "El dibujo a mano alzada requiere el trazado de aristas ocultas, mientras que el dibujo lineal solo representa el perfil."
        ]
      },
      {
        question: "16. ¿Cuál es el objetivo principal del Dibujo Técnico frente al dibujo artístico?",
        options: [
          "Aportar información exacta y clara que facilite el diseño, análisis, construcción y mantenimiento de objetos mediante normas fijas.",
          "Desarrollar la sensibilidad estética y la creatividad personal del dibujante sin atender a dimensiones precisas ni escalas fijas.",
          "Crear bocetos simplificados a mano alzada a partir de la imaginación para decorar documentos y libros de texto escolares."
        ]
      },
      {
        question: "17. ¿Qué define a la vista del alzado en el conjunto de vistas de un objeto?",
        options: [
          "Es la vista principal del objeto elegida para aportar la mayor información sobre su forma y características.",
          "Es la vista superior de la figura obtenida al mirar el objeto verticalmente desde arriba hacia abajo.",
          "Es la vista lateral que muestra las zonas ocultas mediante el trazado de líneas gruesas continuas."
        ]
      },
      {
        question: "18. ¿Cómo se posicionan las líneas auxiliares de cota respecto a las líneas de cota?",
        options: [
          "Son líneas auxiliares de cota perpendiculares a las anteriores.",
          "Son líneas auxiliares de cota paralelas trazadas sobre las aristas.",
          "Son líneas auxiliares de cota inclinadas a 45º sobre la cifra."
        ]
      },
      {
        question: "19. ¿Cuál es la inclinación y proporciones de los ángulos del cartabón?",
        options: [
          "El cartabón es escaleno (90º, 30º, 60º).",
          "El cartabón es isósceles (90º, 45º, 45º).",
          "El cartabón es equilátero (60º, 60º, 60º)."
        ]
      },
      {
        question: "20. ¿Qué ventaja ofrece el nonio en el calibre o pie de rey?",
        options: [
          "Permite medir piezas pequeñas con precisión midiendo fracciones de mm.",
          "Permite trazar ángulos rectos y paralelos sobre la superficie de madera.",
          "Permite extender la medición a grandes distancias en terrenos y obras."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
