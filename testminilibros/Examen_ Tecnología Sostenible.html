<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen: Tecnología Sostenible</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.2;
      font-size: 12px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 10px auto;
      max-width: 950px;
    }

    .header-title-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      text-transform: uppercase;
    }

    .warning-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: #dc2626;
      text-transform: uppercase;
    }

    .student-info {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.8rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.8rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 100px;
      height: 22px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .score-box {
      width: 50px;
      height: 22px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas en Única Fila (1 a 20) */
    .answer-grid-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 3px;
      text-align: center;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 1px 0;
      font-size: 0.68rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table th.header-col {
      width: 45px;
      background-color: #e2e8f0;
    }

    .answer-grid-table td {
      height: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test */
    .quiz-container {
      max-width: 950px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 5px 7px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.78rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      padding: 1px 3px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 1px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.74rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 950px;
      margin: 8px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 950px;
      margin: 4px auto;
      padding: 6px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
      font-size: 0.85rem;
    }

    /* ESTILOS DE IMPRESIÓN COMPACTOS */
    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm 6mm 6mm 6mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 10px;
        line-height: 1.15;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 4px 8px;
        margin: 0 0 6px 0;
        max-width: 100%;
      }

      .header-title-box {
        border-bottom: 1px solid #000000;
        margin-bottom: 4px;
        padding-bottom: 2px;
      }

      .header-title {
        font-size: 0.9rem;
      }

      .warning-text {
        font-size: 0.7rem;
        color: #000000;
      }

      .student-info {
        margin-bottom: 4px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 0;
        font-size: 0.6rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 4px 8px;
      }

      .question-card {
        border: 1px solid #64748b;
        padding: 3px 5px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.72rem;
        margin-bottom: 1px;
      }

      .option-label {
        font-size: 0.68rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 9px;
        height: 9px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-title-box">
      <div class="header-title">Examen: Tecnología Sostenible</div>
      <div class="warning-text">Intentar copiar supone un cero y parte</div>
    </div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.8rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <div class="table-wrapper">
      <table class="answer-grid-table">
        <thead>
          <tr>
            <th class="header-col">Preg.</th>
            <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
            <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
            <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th>
            <th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th class="header-col">Rpta.</th>
            <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
            <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
            <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
            <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Banco de 20 preguntas basadas fielmente en el documento de Tecnología Sostenible
    const rawQuestionsData = [
      {
        question: "¿Qué implica la sostenibilidad en la selección de materiales?",
        options: [
          { text: "Considerar la ecoeficiencia y el ciclo de vida del material.", correct: true },
          { text: "Priorizar únicamente el costo económico más bajo de compra.", correct: false },
          { text: "Utilizar plásticos sintéticos no reciclables en la producción.", correct: false }
        ]
      },
      {
        question: "¿Cuál de los siguientes es un ejemplo de material biodegradable?",
        options: [
          { text: "Ladrillos de arcilla y madera.", correct: true },
          { text: "Espuma sintética industrial.", correct: false },
          { text: "Placas compuestas de PVC.", correct: false }
        ]
      },
      {
        question: "¿A qué se refiere el término accesibilidad en los materiales sostenibles?",
        options: [
          { text: "A la disponibilidad, asequibilidad y justicia en la cadena de suministro.", correct: true },
          { text: "A la resistencia mecánica ante impactos de gran fuerza.", correct: false },
          { text: "A la capacidad del material para aislar descargas eléctricas.", correct: false }
        ]
      },
      {
        question: "¿Qué material local se menciona como usado tradicionalmente en tejados?",
        options: [
          { text: "Pizarra.", correct: true },
          { text: "Aluminio.", correct: false },
          { text: "Poliuretano.", correct: false }
        ]
      },
      {
        question: "¿Cuál es el enfoque principal del diseño sostenible de procesos y sistemas?",
        options: [
          { text: "Optimizar la eficiencia, reducir desperdicios y la huella ecológica.", correct: true },
          { text: "Aumentar la velocidad de fabricación sin medir los residuos.", correct: false },
          { text: "Maximizar el uso de insumos químicos sintéticos importados.", correct: false }
        ]
      },
      {
        question: "¿Qué elemento reutilizado se ejemplifica para la fabricación de viviendas?",
        options: [
          { text: "Contenedores metálicos.", correct: true },
          { text: "Neumáticos quemados.", correct: false },
          { text: "Chasis de automóviles.", correct: false }
        ]
      },
      {
        question: "¿Qué caracteriza a la arquitectura bioclimática?",
        options: [
          { text: "Aprovechar las condiciones climáticas locales para el confort interior.", correct: true },
          { text: "Depender exclusivamente de sistemas mecánicos de climatización.", correct: false },
          { text: "Construir edificios herméticos sin ventanas hacia el exterior.", correct: false }
        ]
      },
      {
        question: "¿Hacia dónde se recomienda orientar la fachada principal de una casa en climas cálidos?",
        options: [
          { text: "Hacia el sur.", correct: true },
          { text: "Hacia el norte.", correct: false },
          { text: "Hacia el oeste.", correct: false }
        ]
      },
      {
        question: "¿Qué estrategia bioclimática se recomienda para amortiguar los cambios de temperatura?",
        options: [
          { text: "Cámaras de aire en las paredes.", correct: true },
          { text: "Ventanas monopanel de vidrio fino.", correct: false },
          { text: "Pinturas de tonos oscuros exteriores.", correct: false }
        ]
      },
      {
        question: "¿Por qué son recomendables los sótanos en climas cálidos?",
        options: [
          { text: "Porque el interior de la tierra está más fresca.", correct: true },
          { text: "Porque acumulan mayor cantidad de radiación solar.", correct: false },
          { text: "Porque permiten instalar calentadores térmicos potentes.", correct: false }
        ]
      },
      {
        question: "¿Qué tecnología de iluminación se aplica para el ahorro energético en edificios?",
        options: [
          { text: "Iluminación LED.", correct: true },
          { text: "Lámparas incandescentes.", correct: false },
          { text: "Tubos de neón tradicionales.", correct: false }
        ]
      },
      {
        question: "¿Qué tipo de placa solar se utiliza específicamente para calentar agua?",
        options: [
          { text: "Placas solares térmicas.", correct: true },
          { text: "Placas fotovoltaicas.", correct: false },
          { text: "Paneles reflectantes pasivos.", correct: false }
        ]
      },
      {
        question: "¿Qué gases menos contaminantes se mencionan para el transporte sostenible?",
        options: [
          { text: "GLP o GNC.", correct: true },
          { text: "Diésel refinado.", correct: false },
          { text: "Monóxido de carbono.", correct: false }
        ]
      },
      {
        question: "¿Qué medios de transporte se promueven para equilibrar la movilidad con el entorno?",
        options: [
          { text: "Bicicletas, tren, patinetes y transporte público.", correct: true },
          { text: "Vehículos deportivos a gasolina y motocicletas de alta cilindrada.", correct: false },
          { text: "Camiones de carga pesada a diésel convencional.", correct: false }
        ]
      },
      {
        question: "¿Cómo ayuda la tecnología a las comunidades abiertas y al voluntariado?",
        options: [
          { text: "Construyendo plataformas inclusivas que abordan desafíos locales.", correct: true },
          { text: "Restringiendo la participación a usuarios con licencias pagadas.", correct: false },
          { text: "Sustituyendo el trabajo de las personas por robots autónomos.", correct: false }
        ]
      },
      {
        question: "¿Qué plataforma se cita como ejemplo para promover la mejora del medio ambiente?",
        options: [
          { text: "Change.org.", correct: true },
          { text: "Wikipedia.", correct: false },
          { text: "Linux Foundation.", correct: false }
        ]
      },
      {
        question: "¿Cuál es el propósito general de los Objetivos de Desarrollo Sostenible (ODS)?",
        options: [
          { text: "Poner fin a la pobreza, proteger el planeta y mejorar vidas.", correct: true },
          { text: "Regular las tasas impositivas del comercio internacional.", correct: false },
          { text: "Fomentar el desarrollo industrial sin restricciones ambientales.", correct: false }
        ]
      },
      {
        question: "¿Qué ODS corresponden al bloque de desarrollo social y humano?",
        options: [
          { text: "ODS 1 al 5.", correct: true },
          { text: "ODS 6 al 11.", correct: false },
          { text: "ODS 12 al 17.", correct: false }
        ]
      },
      {
        question: "¿A qué categoría pertenecen los ODS del 6 al 11?",
        options: [
          { text: "Economía, infraestructura y ciudades sostenibles.", correct: true },
          { text: "Vida submarina y alianzas globales.", correct: false },
          { text: "Fin de la pobreza e igualdad de género.", correct: false }
        ]
      },
      {
        question: "¿Qué ODS aborda directamente la 'Acción por el clima'?",
        options: [
          { text: "ODS 13.", correct: true },
          { text: "ODS 5.", correct: false },
          { text: "ODS 2.", correct: false }
        ]
      }
    ];

    // Algoritmo de aleatorización de Fisher-Yates
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';

      // Limpiar plantilla de respuestas e información previa
      for(let i = 1; i <= 20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      // 1. Clonación profunda (Deep Copy)
      const deepClonedData = rawQuestionsData.map(q => ({
        question: q.question,
        options: q.options.map(o => ({ ...o }))
      }));

      // 2. Aleatorizar preguntas
      const shuffledQuestions = shuffleArray(deepClonedData);

      shuffledQuestions.forEach((qItem, qIndex) => {
        const qNum = qIndex + 1;
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        qTitle.innerText = `${qNum}. ${qItem.question}`;
        questionCard.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        // 3. Aleatorizar opciones
        const shuffledOptions = shuffleArray(qItem.options);

        shuffledOptions.forEach((optObj, optIndex) => {
          const letter = ['a', 'b', 'c'][optIndex];

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;
          inputRadio.dataset.correct = optObj.correct;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optObj.text}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.dataset.correct === "true") {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    // Ejecución al cargar o refrescar la página
    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
