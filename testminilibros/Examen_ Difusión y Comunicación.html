<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Difusión y Comunicación - Opciones Equilibradas</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-title">Examen: Difusión y Comunicación (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Las respuestas correctas contienen la literalidad exacta extraída de Difusión.html.
    // Los distractores han sido equilibrados en extensión y nivel de redacción.
    const questionsData = [
      {
        question: "1. ¿Cómo se define la presentación de un proyecto?",
        options: [
          "La presentación es como cuentas y muestras tu proyecto a otras personas. Es importante hacerlo de manera organizada y clara para que quienes te escuchan o ven puedan entender de qué se trata.",
          "Consiste en archivar documentos técnicos en carpetas digitales cifradas para garantizar que ningún usuario externo pueda acceder al contenido ni evaluar los resultados de la investigación.",
          "Se define como la reunión privada de evaluación donde exclusivamente los ingenieros del proyecto analizan la viabilidad económica interna sin mostrar imágenes ni esquemas explicativos."
        ]
      },
      {
        question: "2. ¿Qué implica el concepto de difusión?",
        options: [
          "La difusión implica llevar tu proyecto más allá de tu círculo cercano y compartirlo con un público más amplio, como en la escuela, comunidad o en línea.",
          "La difusión consiste en mantener la información restringida al equipo interno de trabajo para evitar que competidores de la misma región conozcan las metodologías empleadas.",
          "Implica imprimir copias físicas en formato borrador para entregarlas únicamente al tutor del proyecto antes de redactar las conclusiones o presentar el prototipo final."
        ]
      },
      {
        question: "3. ¿Qué son los elementos de un proyecto según el texto?",
        options: [
          "Los elementos son como las piezas importantes que componen tu proyecto. Pueden ser las ideas clave, los datos importantes o los materiales que necesitas.",
          "Son las reglas gramaticales específicas que se utilizan de forma obligatoria al redactar un informe técnico en un procesador de textos para publicaciones científicas.",
          "Hacen referencia exclusiva a los programas informáticos y herramientas digitales que se requieren para calcular los presupuestos económicos del equipo de trabajo."
        ]
      },
      {
        question: "4. ¿Qué representan las técnicas en la elaboración de un proyecto?",
        options: [
          "Las técnicas son como las estrategias o métodos que utilizas para hacer diferentes partes de tu proyecto, por ejemplo, usar imágenes llamativas.",
          "Representan el conjunto de licencias comerciales y permisos legales necesarios para distribuir el producto en establecimientos o tiendas de comercio electrónico.",
          "Son los manuales de usuario que redactan los fabricantes de maquinaria pesada para evitar accidentes laborales durante la fase de ensamblaje en el taller."
        ]
      },
      {
        question: "5. ¿Qué son las herramientas y qué tipos se mencionan?",
        options: [
          "Las herramientas son cosas que utilizas para llevar a cabo tu proyecto. Pueden ser físicas, como lápices y papel, o digitales, como una computadora.",
          "Son de forma exclusiva las aplicaciones móviles de mensajería instantánea que emplean los usuarios para enviar comentarios sobre el diseño de la maqueta.",
          "Representan los criterios financieros que permiten evaluar las pérdidas y ganancias obtenidas tras la venta directa de prototipos en eventos y ferias."
        ]
      },
      {
        question: "6. ¿Cómo se caracteriza la comunicación efectiva?",
        options: [
          "La comunicación efectiva es la forma en que te expresas para que otros te entiendan de la mejor manera posible, involucrando emisor, receptor y canal.",
          "Consiste en utilizar vocabulario técnico especializado de alta complejidad para demostrar un dominio absoluto de la materia sin importar el nivel de la audiencia.",
          "Es la habilidad de hablar a gran velocidad durante una exposición para transmitir la mayor cantidad de datos en el menor tiempo disponible en el escenario."
        ]
      },
      {
        question: "7. ¿En qué consiste la entonación al hablar?",
        options: [
          "La entonación es cómo varías tu voz al hablar. Puedes usar entonaciones altas o bajas para mostrar emoción o enfatizar puntos importantes.",
          "Es la capacidad de mantener exactamente el mismo tono de voz monótono durante toda la presentación para evitar distracciones en el público presente.",
          "Consiste en pronunciar únicamente las consonantes finales de cada palabra para lograr un efecto acústico más claro en recintos de gran tamaño."
        ]
      },
      {
        question: "8. ¿Qué abarca el término expresión en la comunicación?",
        options: [
          "La expresión es cómo muestras tus emociones y pensamientos a través de tu lenguaje corporal y facial mientras hablas.",
          "Es la lectura textual y sin pausas de las diapositivas o documentos impresos preparados previamente para la conferencia académica.",
          "Consiste en proyectar la voz a través de micrófonos profesionales de alta fidelidad para garantizar que se escuche en salas de conferencias."
        ]
      },
      {
        question: "9. ¿Qué significa llevar a cabo una correcta gestión del tiempo?",
        options: [
          "La gestión del tiempo significa que eres consciente del tiempo que tienes para hablar o presentar, queriendo asegurarte de no apresurarte ni hablar demasiado lento.",
          "Significa terminar la exposición en la mitad del tiempo asignado para demostrar una capacidad excepcional de síntesis y velocidad narrativa.",
          "Consiste en cronometrar el tiempo que tarda la audiencia en realizar preguntas al final de la exposición para limitar las intervenciones a un minuto."
        ]
      },
      {
        question: "10. ¿En qué consiste la adaptación del discurso?",
        options: [
          "La adaptación del discurso implica ajustar la forma en que hablas según tu audiencia y el contexto, alternando lenguaje informal o académico.",
          "Consiste en memorizar un único guion rígido y repetirlo de forma idéntica sin importar si el público está formado por niños, especialistas o el público general.",
          "Es la técnica de traducir simultáneamente la presentación a varios idiomas extranjeros mediante el uso de software de inteligencia artificial en tiempo real."
        ]
      },
      {
        question: "11. ¿Cuál es el objetivo principal del uso del lenguaje inclusivo?",
        options: [
          "que no excluya ni discrimine a nadie debido a su género.",
          "Garantizar que todas las oraciones utilicen términos exclusivamente técnicos e influencias de idiomas extranjeros para darle mayor prestigio a la ponencia.",
          "Asegurar que las diapositivas contengan el menor número de palabras posible para evitar errores de ortografía durante la presentación pública."
        ]
      },
      {
        question: "12. ¿Qué cambio propone el ejemplo práctico de lenguaje inclusivo?",
        options: [
          "En lugar de decir \"todos los estudiantes deben hacer esto\", puedes decir \"todas las personas deben hacer esto\" para incluir a todos sin importar su género.",
          "En lugar de utilizar esquemas visuales, se recomienda entregar resúmenes impresos en papel reciclado a cada uno de los asistentes antes de comenzar la charla.",
          "Cambiar la denominación de los archivos digitales por códigos numéricos complejos para evitar que se confundan durante la transmisión en la red local."
        ]
      },
      {
        question: "13. ¿Por qué se debe presentar un proyecto de forma organizada y clara?",
        options: [
          "para que quienes te escuchan o ven puedan entender de qué se trata.",
          "para asegurar que la presentación dure exactamente el doble de tiempo del previsto inicialmente por la organización.",
          "para evitar que los asistentes realicen preguntas al finalizar la exposición de los materiales seleccionados."
        ]
      },
      {
        question: "14. ¿A qué entornos puede extenderse la difusión de un trabajo?",
        options: [
          "la escuela, comunidad o en línea.",
          "únicamente a archivos privados de empresas multinacionales del sector industrial.",
          "exclusivamente a registros notariales sin posibilidad de divulgación pública."
        ]
      },
      {
        question: "15. Menciona un ejemplo de técnica aplicable a la presentación de un proyecto:",
        options: [
          "usar imágenes llamativas.",
          "comprar materiales de laboratorio de alto coste económico para la fase de pruebas.",
          "redactar el documento final empleando diferentes tipografías en cada párrafo."
        ]
      },
      {
        question: "16. ¿Qué tres elementos interactúan en la comunicación efectiva?",
        options: [
          "involucrando emisor, receptor y canal.",
          "involucrando pantalla, proyector y conexión a internet.",
          "involucrando presupuesto, herramientas físicas y calendario de entregas."
        ]
      },
      {
        question: "17. ¿Para qué se utilizan las entonaciones altas o bajas al hablar?",
        options: [
          "para mostrar emoción o enfatizar puntos importantes.",
          "para comprobar la calidad de la acústica de la sala antes de iniciar la charla.",
          "para ocultar la falta de preparación sobre el contenido técnico del proyecto."
        ]
      },
      {
        question: "18. ¿A través de qué canales se manifiesta la expresión según el texto?",
        options: [
          "a través de tu lenguaje corporal y facial mientras hablas.",
          "a través de mensajes escritos en folletos impresos distribuidos al público.",
          "a través de la regulación del volumen de los altavoces de la sala de conferencias."
        ]
      },
      {
        question: "19. ¿Qué se busca evitar mediante la gestión del tiempo?",
        options: [
          "asegurarte de no apresurarte ni hablar demasiado lento.",
          "evitar el uso de recursos audiovisuales como maquetas o diapositivas dinámicas.",
          "impedir que la audiencia tome notas o intervenga en el turno final de preguntas."
        ]
      },
      {
        question: "20. ¿Qué registros de lenguaje se pueden alternar según la audiencia?",
        options: [
          "alternando lenguaje informal o académico.",
          "alternando idiomas extranjeros con dialectos antiguos de la región.",
          "alternando códigos de programación con terminología médica especializada."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
