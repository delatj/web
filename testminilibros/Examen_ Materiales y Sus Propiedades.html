<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Materiales y Sus Propiedades - Citas Literales</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON PLANTILLA DE RESPUESTAS Y DATOS -->
  <div class="header-container">
    <div class="header-title">Examen: Materiales y Sus Propiedades (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <!-- TABLA DE RESPUESTAS RÁPIDAS PARA CORRECCIÓN -->
    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <!-- CONTENEDOR DEL TEST EN 2 COLUMNAS -->
  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Preguntas con respuestas sacadas LITERALMENTE del texto de Materiales.html
    // La opción en el índice 0 es siempre la respuesta correcta literal.
    const questionsData = [
      {
        question: "1. ¿Qué se conoce como materias primas?",
        options: [
          "Se conocen como materias primas a la materia extraída de la naturaleza que se transforma para elaborar materiales que más tarde se convertirán en bienes de consumo.",
          "Se conocen como materias primas a los productos sintéticos creados mediante procesos químicos industriales que no requieren recursos naturales directos.",
          "Se conocen como materias primas a los objetos finales que han sido diseñados y ensamblados comercialmente para su venta directa al consumidor."
        ]
      },
      {
        question: "2. ¿Qué relación hay entre materiales y producto tecnológico?",
        options: [
          "Los materiales son materias primas transformadas. Un producto tecnológico es el objeto construido a partir de los materiales para obtener un bien final.",
          "Los materiales son los bienes de consumo directo. Un producto tecnológico es la herramienta que extrae la materia sin necesidad de transformación.",
          "Los materiales son residuos industriales no utilizables. Un producto tecnológico es la sustancia sintética empleada para sustituir los recursos minerales."
        ]
      },
      {
        question: "3. ¿Qué caracteriza al material cerámico y a los textiles?",
        options: [
          "El material cerámico es inorgánico y buen aislante, moldeado con arcilla. Los materiales textiles tienen como estructura básica la fibra o filamentos para formar hilos.",
          "El material cerámico es un compuesto sintético flexible. Los materiales textiles tienen como estructura básica bloques masivos de rocas ígneas moldeadas por la presión de la atmósfera.",
          "El material cerámico se extrae de la madera noble de árboles. Los materiales textiles son aleaciones metálicas obtenidas a partir de minerales procesados."
        ]
      },
      {
        question: "4. ¿Cómo se obtienen las maderas y los materiales metálicos?",
        options: [
          "La madera es la parte sólida de los árboles bajo la corteza. Los materiales metálicos se obtienen de minerales en yacimientos o de sus combinaciones en aleaciones.",
          "La madera se obtiene por descomposición biológica de rocas. Los materiales metálicos se producen mediante polimerización de aceites vegetales residuales.",
          "La madera es el fruto seco recolectado de la corteza de árboles y arbustos. Los materiales metálicos provienen de la solidificación directa de la arcilla fundida en hornos."
        ]
      },
      {
        question: "5. ¿De dónde proceden los materiales pétreos y cómo se obtienen los plásticos?",
        options: [
          "Los pétreos proceden de las rocas naturales como el mármol. Los plásticos son sintéticos, obtenidos mediante polimerización de compuestos derivados del petróleo.",
          "Los pétreos proceden de fibras textiles entrelazadas. Los plásticos se extraen directamente de la tala de árboles de gran masa forestal.",
          "Los pétreos provienen de la fundición de arcilla fina del lecho de los rios. Los plásticos son minerales extraídos de yacimientos volcánicos de alta temperatura."
        ]
      },
      {
        question: "6. ¿Cómo se definen la dureza y la resistencia en las propiedades mecánicas?",
        options: [
          "La dureza es la resistencia al rayado. La resistencia es la oposición a la destrucción o deformación por cargas externas.",
          "La dureza es la capacidad para conducir calor rápido. La resistencia es la facilidad del material para derretirse o fundirse sin romperse.",
          "La dureza es la posibilidad de formar hilos finos. La resistencia es la propiedad por la que el material vuelve a su estado inicial tras estirarse."
        ]
      },
      {
        question: "7. ¿Cuáles son las fuerzas o esfuerzos mecánicos principales?",
        options: [
          "Las fuerzas principales son la tracción (estira), compresión (acorta), flexión (dobla el centro), torsión (retuerce), cortadura (desplaza lados) y pandeo (flexión en piezas esbeltas).",
          "Las fuerzas principales son la dilatación (agranda), fusión (derrite), oxidación (decolora), conducción (calienta), aislamiento (bloquea) y filtración (atraviesa).",
          "Las fuerzas principales son la transparencia (permite luz), opacidad (bloquea visión), plasticidad (deforma), elasticidad (retorna), fragilidad (rompe) y dureza (raya)."
        ]
      },
      {
        question: "8. ¿Qué diferencias hay entre elasticidad, plasticidad, ductilidad, tenacidad y fragilidad?",
        options: [
          "Elasticidad es volver al estado inicial. Plasticidad es la deformación permanente. Ductilidad permite obtener hilos. Tenacidad absorbe impactos y fragilidad es rotura fácil.",
          "Elasticidad es resistir el rayado. Plasticidad es conducir corriente. Ductilidad es el aumento de tamaño. Tenacidad es no dejar pasar luz ultravioleta y fragilidad es oxidarse.",
          "Elasticidad es la rotura ante golpes. Plasticidad es formar láminas. Ductilidad es la oposición a la luz. Tenacidad es la rigidez ante doblado y fragilidad es estirarse."
        ]
      },
      {
        question: "9. ¿Cómo responden los aislantes, conductores y semiconductores ante la corriente eléctrica?",
        options: [
          "Los aislantes la dificultan, los conductores la permiten fácilmente y los semiconductores solo en determinadas condiciones.",
          "Los aislantes la reflejan, los conductores la absorben volviéndose opacos y los semiconductores la transforman en calor continuo.",
          "Los aislantes la transmiten con aceleración, los conductores la bloquean por completo y los semiconductores cambian la composición del hierro."
        ]
      },
      {
        question: "10. ¿Cómo se clasifican los materiales según las propiedades ópticas?",
        options: [
          "Opacos no dejan pasar la luz ni ver a través. Transparentes dejan pasar luz y visión. Translúcidos dejan pasar luz pero no permiten ver a través.",
          "Opacos permiten la visión clara. Transparentes cambian de color al sol. Translúcidos absorben las radiaciones térmicas destruyendo el material.",
          "Opacos se doblan sin romperse. Transparentes conducen la corriente fácilmente. Translúcidos vuelven a su forma inicial al cesar la luz."
        ]
      },
      {
        question: "11. ¿Qué indican la dilatación, la conductividad y la fusibilidad?",
        options: [
          "La dilatación aumenta dimensiones. La conductividad mide el paso de calor. La fusibilidad es la facilidad del material para derretirse o fundirse.",
          "La dilatación destruye el objeto. La conductividad mide la resistencia al rayado. La fusibilidad es la capacidad para formar hilos muy delgados.",
          "La dilatación reduce el volumen. La conductividad impide el paso de corriente. La fusibilidad es la fuerza que opone el material al impacto directo."
        ]
      },
      {
        question: "12. ¿Qué ocurre en las propiedades químicas y cómo se define la oxidación?",
        options: [
          "Ocurren cuando la materia cambia de composición al reaccionar. La más destacada es la oxidación, una reacción química muy poderosa donde un elemento cede electrones,ej el hierro se une al oxígeno del aire, pierde electrones y se convierte en óxido de hierro.",
          "Ocurren cuando el material cambia de forma sin alterar su estructura interior. La más destacada es la oxidación, una deformación física reversible al aplicar calor extremo.",
          "Ocurren cuando el material se disuelve completamente en agua fría. La más destacada es la oxidación, un proceso biológico generado exclusivamente por plantas y hongos."
        ]
      },
      {
        question: "13. ¿Qué beneficio aportan los materiales reciclables y cómo actúan los biodegradables?",
        options: [
          "Reciclables reducen consumo y contaminación. Biodegradables se descomponen en elementos químicos por agentes biológicos naturales como plantas, hongos o microorganismos.",
          "Reciclables aumentan la producción de plásticos. Biodegradables permanecen inalterables en vertederos durante siglos sin sufrir trasformaciones.",
          "Reciclables evitan la conducción térmica bajo ciertas condiciones ambientales. Biodegradables requieren ser incinerados o almacenados con residuos tóxicos bajo estrictas normas."
        ]
      },
      {
        question: "14. ¿Qué define a los materiales tóxicos y cómo deben gestionarse?",
        options: [
          "Son aquellos no reciclables ni biodegradables. Requieren ser incinerados, almacenados en vertederos o tratados de forma especial para minimizar su impacto ecológico y humano.",
          "Son aquellos que conducen la corriente eléctrica. Requieren ser moldeados con arcilla e integrados en estructuras arquitectónicas o mecánicas.",
          "Son aquellos que se deforman sin romperse. Requieren ser estirados para formar hilos y almacenados junto a materias primas de origen vegetal en almacenes a baja temperatra y humedad."
        ]
      },
      {
        question: "15. ¿De qué fuente natural se extrae la materia para elaborar las materias primas?",
        options: [
          "Se extrae de la naturaleza que se transforma para elaborar materiales.",
          "Se extrae de la combinación sintética de polímeros creados en laboratorios sin presencia de recursos naturales.",
          "Se obtiene directamente del procesamiento industrial de objetos y bienes de consumo previamente desechados."
        ]
      },
      {
        question: "16. ¿Cuál es el proceso de producción de los materiales plásticos?",
        options: [
          "Los plásticos son sintéticos, obtenidos mediante polimerización de compuestos derivados del petróleo.",
          "Los plásticos son naturales, obtenidos mediante la talla y secado de la parte sólida de los árboles.",
          "Los plásticos son inorgánicos, obtenidos por la cocción y moldeo directo de la arcilla húmeda."
        ]
      },
      {
        question: "17. ¿Qué esfuerzo mecánico se caracteriza por retorcer una pieza?",
        options: [
          "torsión",
          "tracción",
          "compresión"
        ]
      },
      {
        question: "18. ¿Qué diferencia principal existe entre un material transparente y uno translúcido?",
        options: [
          "Transparentes dejan pasar luz y visión. Translúcidos dejan pasar luz pero no permiten ver a través.",
          "Transparentes no dejan pasar la luz. Translúcidos permiten ver los objetos con total claridad de detalles.",
          "Transparentes reflejan la luz solar. Translúcidos impiden que la corriente eléctrica atraviese el cuerpo."
        ]
      },
      {
        question: "19. ¿Qué agente natural participa en la descomposición de los materiales biodegradables?",
        options: [
          "agentes biológicos naturales como plantas, hongos o microorganismos.",
          "compuestos químicos derivados del petróleo y aceites sintéticos.",
          "minerales extraídos de yacimientos y aleaciones de alta resistencia."
        ]
      },
      {
        question: "20. ¿Qué le ocurre al hierro durante la reacción química de oxidación?",
        options: [
          "el hierro se une al oxígeno del aire, pierde electrones y se convierte en óxido de hierro.",
          "el hierro absorbe agua, recupera su forma inicial y aumenta su elasticidad estructural.",
          "el hierro gana electrones del aire y se convierte en un material metálico transparente a grandes grosores."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
