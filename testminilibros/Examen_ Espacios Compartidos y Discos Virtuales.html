<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen - Espacios Compartidos y Discos Virtuales</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-title">Examen: Espacios Compartidos y Discos Virtuales (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Estructura de datos con indicación explícita de la opción correcta
    const questionsData = [
      {
        question: "¿Qué son exactamente los discos virtuales?",
        options: [
          { text: "Dispositivos lógicos creados por software que guardan información como un disco físico.", correct: true },
          { text: "Dispositivos magnéticos metálicos instalados directamente en el chasis del ordenador.", correct: false },
          { text: "Unidades de memoria RAM volátil orientadas a acelerar la tarjeta gráfica externa.", correct: false }
        ]
      },
      {
        question: "¿Cómo se crean y gestionan los discos virtuales?",
        options: [
          { text: "Se generan mediante software especializado para simular el almacenamiento físico.", correct: true },
          { text: "Se construyen conectando varios cables de fibra óptica en la placa base principal.", correct: false },
          { text: "Se configuran formateando memorias USB físicas en un lector de tarjetas externo.", correct: false }
        ]
      },
      {
        question: "¿Qué contiene un archivo de imagen de disco (ISO)?",
        options: [
          { text: "Una copia exacta de la estructura y el contenido de un medio de almacenamiento.", correct: true },
          { text: "Un resumen de texto con las licencias de uso de los programas informáticos.", correct: false },
          { text: "Una lista con accesos directos que apuntan a archivos guardados en la web.", correct: false }
        ]
      },
      {
        question: "¿Qué soportes físicos pueden replicarse en una imagen ISO?",
        options: [
          { text: "Discos CD, DVD, unidades de disco duro tradicionales y memorias de tipo USB.", correct: true },
          { text: "Únicamente discos ópticos de formato Blu-ray grabados de forma permanente.", correct: false },
          { text: "Solamente memorias secundarias alojadas dentro de servidores de red local.", correct: false }
        ]
      },
      {
        question: "¿Cuál es el propósito principal de usar una imagen ISO?",
        options: [
          { text: "Reproducir fielmente todo el contenido sin depender del dispositivo físico original.", correct: true },
          { text: "Duplicar la memoria RAM disponible para ejecutar aplicaciones mucho más rápido.", correct: false },
          { text: "Acelerar el procesamiento de los gráficos dentro de los juegos de última generación.", correct: false }
        ]
      },
      {
        question: "¿Qué función cumple una Máquina Virtual (VM)?",
        options: [
          { text: "Es un programa informático especializado que simula un ordenador completo en otro.", correct: true },
          { text: "Es un componente físico del procesador que incrementa la velocidad de reloj interna.", correct: false },
          { text: "Es una red privada de servidores que administra la conexión de fibra hacia internet.", correct: false }
        ]
      },
      {
        question: "¿Dónde almacenan sus datos las máquinas virtuales?",
        options: [
          { text: "En discos virtuales que pueden ser archivos únicos de sistema completo o parcial.", correct: true },
          { text: "En memorias caché externas conectadas a través del puerto serie de la máquina.", correct: false },
          { text: "En particiones no formateadas dentro del microprocesador principal del sistema.", correct: false }
        ]
      },
      {
        question: "¿Qué componentes se alojan en el disco virtual de una VM?",
        options: [
          { text: "Los archivos del sistema operativo virtualizado y todos los datos del usuario.", correct: true },
          { text: "Exclusivamente las copias de seguridad de la memoria BIOS del equipo anfitrión.", correct: false },
          { text: "Solamente los controladores de la tarjeta gráfica del ordenador físico principal.", correct: false }
        ]
      },
      {
        question: "¿Qué plataformas son referentes en almacenamiento en la nube?",
        options: [
          { text: "Servicios populares tales como Google Drive, la plataforma Dropbox y OneDrive.", correct: true },
          { text: "Entornos de desarrollo como Visual Studio, herramientas Eclipse y NetBeans.", correct: false },
          { text: "Buscadores en línea como DuckDuckGo, el portal Yahoo y el navegador Bing.", correct: false }
        ]
      },
      {
        question: "¿Cómo actúan los servicios de almacenamiento en la nube?",
        options: [
          { text: "Funcionan como discos virtuales para guardar, acceder y compartir en internet.", correct: true },
          { text: "Operan como tarjetas de red encargadas de enviar datos por cables telefónicos.", correct: false },
          { text: "Actúan como controladores gráficos dedicados a procesar vídeo en alta resolución.", correct: false }
        ]
      },
      {
        question: "¿Qué definimos como espacios compartidos en Internet?",
        options: [
          { text: "Plataformas en línea para colaborar, interactuar, compartir o trabajar en grupo.", correct: true },
          { text: "Carpetas locales del sistema protegidas con contraseña dentro del disco C.", correct: false },
          { text: "Cables de red de alta velocidad que conectan dos ordenadores de forma directa.", correct: false }
        ]
      },
      {
        question: "¿Qué funciones principales ofrecen las redes sociales?",
        options: [
          { text: "Conectar a los usuarios, compartir contenidos diversos, interactuar y colaborar.", correct: true },
          { text: "Instalar aplicaciones del sistema operativo de manera remota y automatizada.", correct: false },
          { text: "Desfragmentar unidades de disco duro mediante la ejecución de comandos web.", correct: false }
        ]
      },
      {
        question: "¿Cuáles son redes sociales ampliamente utilizadas?",
        options: [
          { text: "Redes conocidas como Facebook, la plataforma X, Instagram y la red LinkedIn.", correct: true },
          { text: "Sistemas de archivos lógicos como NTFS, el formato FAT32 y el sistema ext4.", correct: false },
          { text: "Protocolos de transferencia como HTTP, la conexión FTP y el estándar SMTP.", correct: false }
        ]
      },
      {
        question: "¿Qué herramientas destacan en plataformas de colaboración?",
        options: [
          { text: "Entornos como Google Workspace, la suite Microsoft 365 y la aplicación Slack.", correct: true },
          { text: "Reproductores multimedia como VLC Player, Winamp y la suite Windows Media.", correct: false },
          { text: "Antivirus de sistema como Avast, la solución Kaspersky y el software Defender.", correct: false }
        ]
      },
      {
        question: "¿Qué utilidades ofrecen las plataformas de colaboración?",
        options: [
          { text: "Trabajar conjuntamente en documentos diversos y comunicarse en tiempo real.", correct: true },
          { text: "Limpiar el polvo acumulado en los componentes internos del ordenador físico.", correct: false },
          { text: "Comprimir archivos pesados en carpetas ZIP sin usar memoria en el sistema.", correct: false }
        ]
      },
      {
        question: "¿Cuál es el propósito fundamental de una Wiki?",
        options: [
          { text: "Permitir a los usuarios contribuir, editar y organizar contenido de forma colectiva.", correct: true },
          { text: "Proteger la red corporativa contra infecciones de virus y ataques informáticos.", correct: false },
          { text: "Reproducir transmisiones de vídeo en alta definición a través de redes locales.", correct: false }
        ]
      },
      {
        question: "¿Cuál es el ejemplo más representativo de una Wiki?",
        options: [
          { text: "La enciclopedia libre colaborativa conocida mundialmente como Wikipedia.", correct: true },
          { text: "La plataforma de almacenamiento y sincronización en la nube llamada Dropbox.", correct: false },
          { text: "El motor de búsqueda en línea y servicios web desarrollado por Google.", correct: false }
        ]
      },
      {
        question: "¿Para qué sirven los foros y comunidades en línea?",
        options: [
          { text: "Para debatir temas variados, formular preguntas y compartir información útil.", correct: true },
          { text: "Para alojar páginas web privadas que no admiten comentarios de los usuarios.", correct: false },
          { text: "Para medir la velocidad de descarga de la conexión a internet de la red.", correct: false }
        ]
      },
      {
        question: "¿Qué aplicaciones representan foros o comunidades en línea?",
        options: [
          { text: "Portales de discusión abiertos tales como Reddit y la plataforma Stack Exchange.", correct: true },
          { text: "Herramientas de correo electrónico como Gmail, Outlook y el cliente Yahoo.", correct: false },
          { text: "Plataformas de blogs personales como la web WordPress y el portal Blogger.", correct: false }
        ]
      },
      {
        question: "¿Qué utilidades caracteriza a la plataforma Blogger?",
        options: [
          { text: "Crear y publicar entradas facilitando la interacción continua con los lectores.", correct: true },
          { text: "Formatear unidades de almacenamiento masivo usando comandos de terminal.", correct: false },
          { text: "Editar fotografías digitales de alta resolución dentro del propio servidor.", correct: false }
        ]
      }
    ];

    // Función global de aleatorización (Fisher-Yates)
    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = array.map(item => ({ ...item }));
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';

      // Limpiar celdas del cuadro de respuestas y mensajes previa evaluación
      for(let i = 1; i <= 20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      // 1. Aleatorizar el orden de las PREGUNTAS
      const shuffledQuestions = shuffle(questionsData);

      shuffledQuestions.forEach((qItem, qIndex) => {
        const qNum = qIndex + 1;
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        qTitle.innerText = `${qNum}. ${qItem.question}`;
        questionCard.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        // 2. Aleatorizar el orden de las OPCIONES dentro de cada pregunta
        const shuffledOptions = shuffle(qItem.options);

        shuffledOptions.forEach((optObj, optIndex) => {
          const letter = ['a', 'b', 'c'][optIndex];

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;
          // Guardamos en un atributo de datos si esta opción es la correcta
          inputRadio.dataset.correct = optObj.correct;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optObj.text}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.dataset.correct === "true") {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    // Se ejecuta automáticamente al cargar/recargar la página
    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
