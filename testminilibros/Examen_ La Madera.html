<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Materiales de Construcción: La Madera - Citas Literales</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.25;
      font-size: 13px;
    }

    /* Encabezado e Hoja de Respuestas */
    .header-container {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 10px auto;
      max-width: 900px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .student-info {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .info-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .info-field label {
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .info-field input {
      flex: 1;
      border: none;
      border-bottom: 1px dashed #64748b;
      padding: 2px 4px;
      font-size: 0.85rem;
      outline: none;
      background: transparent;
    }

    .date-box-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-box {
      width: 120px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    .score-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .score-box {
      width: 60px;
      height: 24px;
      border: 1px solid #64748b;
      border-radius: 3px;
    }

    /* Tabla de Plantilla de Respuestas rápida */
    .answer-grid-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
      text-align: center;
    }

    .answer-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }

    .answer-grid-table th, .answer-grid-table td {
      border: 1px solid #94a3b8;
      text-align: center;
      padding: 2px 0;
      font-size: 0.75rem;
    }

    .answer-grid-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    .answer-grid-table td {
      height: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Contenedor del Test (Columnas compactas) */
    .quiz-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .option-item:hover {
      background-color: #f1f5f9;
    }

    .option-item input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
    }

    /* Botones de acción */
    .actions-bar {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-success {
      background-color: #16a34a;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .result-msg {
      max-width: 900px;
      margin: 5px auto;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      display: none;
    }

    /* ESTILOS DE IMPRESIÓN AJUSTADOS PARA 2 PÁGINAS A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 8mm 8mm 8mm;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-size: 11px;
        line-height: 1.2;
      }

      .actions-bar, .result-msg {
        display: none !important;
      }

      .header-container {
        border: 1px solid #000000;
        padding: 6px 10px;
        margin: 0 0 8px 0;
        max-width: 100%;
      }

      .header-title {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .student-info {
        margin-bottom: 6px;
      }

      .answer-grid-table th, .answer-grid-table td {
        border: 1px solid #000000;
        padding: 1px 0;
        font-size: 0.7rem;
      }

      .quiz-container {
        max-width: 100%;
        padding: 0;
        gap: 6px 10px;
      }

      .question-card {
        border: 1px solid #94a3b8;
        padding: 5px 6px;
        margin-bottom: 0;
      }

      .question-text {
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      .option-label {
        font-size: 0.74rem;
      }

      .option-item input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border: 1px solid #000;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON PLANTILLA DE RESPUESTAS Y DATOS -->
  <div class="header-container">
    <div class="header-title">Examen: La Madera (intentar copiar supone 0 y parte)</div>
    
    <div class="student-info">
      <div class="info-field">
        <label>Nombre del Alumno/a:</label>
        <input type="text" placeholder="Escriba el nombre completo...">
      </div>
      <div class="date-box-container">
        <label style="font-weight: 700; font-size: 0.85rem;">Fecha:</label>
        <div class="date-box"></div>
      </div>
      <div class="score-field">
        <span>Nota:</span>
        <div class="score-box"></div>
      </div>
    </div>

    <!-- TABLA DE RESPUESTAS RÁPIDAS PARA CORRECCIÓN -->
    <div class="answer-grid-title">Tabla de Respuestas (Escriba la letra a, b o c elegida)</div>
    <table class="answer-grid-table">
      <thead>
        <tr>
          <th>Preg.</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Rpta.</th>
          <td id="cell-1"></td><td id="cell-2"></td><td id="cell-3"></td><td id="cell-4"></td><td id="cell-5"></td>
          <td id="cell-6"></td><td id="cell-7"></td><td id="cell-8"></td><td id="cell-9"></td><td id="cell-10"></td>
          <td id="cell-11"></td><td id="cell-12"></td><td id="cell-13"></td><td id="cell-14"></td><td id="cell-15"></td>
          <td id="cell-16"></td><td id="cell-17"></td><td id="cell-18"></td><td id="cell-19"></td><td id="cell-20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BARRA DE ACCIONES -->
  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="shuffleQuiz()">Reorganizar Preguntas</button>
    <button class="btn btn-success" onclick="checkAnswers()">Comprobar Aciertos</button>
    <button class="btn" onclick="window.print()">Imprimir / Guardar PDF (Ctrl+P)</button>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <!-- CONTENEDOR DEL TEST EN 2 COLUMNAS -->
  <div class="quiz-container" id="quiz-container"></div>

  <script>
    // Preguntas con respuestas sacadas LITERALMENTE del texto de Madera.html
    // La opción en el índice 0 es siempre la respuesta correcta literal.
    const questionsData = [
      {
        question: "1. ¿Cómo se define la madera y qué otros productos se extraen de los árboles?",
        options: [
          "Parte sólida de los árboles y arbustos cubierta por la corteza. Los árboles forman anillos concéntricos por el crecimiento de biomasa de celulosa unida con lignina,otros productos que se extraen de los árboles son el papel y el cartón..",
          "Materia sintética obtenida mediante polimerización de compuestos orgánicos. Los árboles forman capas cuadradas de resina y otros productos extraídos son el plástico y el vidrio.",
          "Tejido vegetal blando que carece de albura y médula central. Los árboles forman fibras minerales impermeables y otros productos extraídos son la arcilla y el mármol."
        ]
      },
      {
        question: "2. ¿De qué partes consta el tronco de un árbol?",
        options: [
          "El tronco consta de corteza externa, cámbium, albura (por donde viaja la savia), duramen en el centro y médula o núcleo vegetal de escasa resistencia.",
          "El tronco consta de corteza interna, fibras aglomeradas, corte lateral, anillos sintéticos en el centro y redondos metálicos de alta flexibilidad.",
          "El tronco consta de capa córnea, escofina, láminas cruzadas de lignina, virutas prensadas en el centro y cepillos mecánicos de gran dureza."
        ]
      },
      {
        question: "3. ¿En qué rango se sitúa la densidad de la madera y de qué depende su resistencia?",
        options: [
          "Varían según la especie originaria. Su resistencia depende de la densidad, que va de 300 a 1200 kg/m³. Destaca además por su comportamiento higroscópico.",
          "Varían según el tipo de corte aplicado. Su resistencia depende del peso del agua, que va de 50 a 200 kg/m³. Destaca además por su opacidad total.",
          "Varían según la herramienta de aserrado. Su resistencia depende de la humedad, que va de 1500 a 3000 kg/m³. Destaca además por su baja fusibilidad."
        ]
      },
      {
        question: "4. ¿Cuál es la composición química elemental y los componentes básicos de la madera?",
        options: [
          "Contiene 50% carbono, 42% oxígeno y 6% hidrógeno. Sus componentes básicos son celulosa (50%), lignina (25%) para dureza y hemicelulosa (25%) como unión.",
          "Contiene 70% nitrógeno, 20% carbono y 10% azufre. Sus componentes básicos son resinas (60%), minerales (20%) para flexibilidad y ceras (20%) como unión.",
          "Contiene 40% hierro, 40% oxígeno y 20% hidrógeno. Sus componentes básicos son siliconas (50%), polímeros (25%) para ligereza y fibra (25%) como aislante."
        ]
      },
      {
        question: "5. ¿Qué diferencias existen entre las maderas duras y las maderas blandas?",
        options: [
          "Las duras (roble, haya) provienen de caducifolios lentos, son densas y caras. Las blandas (pino, abeto) vienen de coníferas, son ligeras y económicas.",
          "Las duras (pino, abeto) provienen de arbustos pequeños, son ligeras y baratas. Las blandas (roble, haya) vienen de plantas textiles, son densas y caras.",
          "Las duras (eucalipto, olmo) provienen de cultivos marinos, son frágiles y escasas. Las blandas (cedro, nogal) vienen de cactus, son maleables y pesadas."
        ]
      },
      {
        question: "6. ¿En qué consiste la tala y de qué forma se transporta la madera al aserradero?",
        options: [
          "La tala realiza el apeo cortando ramas y raíces, preferiblemente en otoño o invierno. Luego se transporta al aserradero en camiones o por ríos.",
          "La tala realiza el pulido y lijado en pie de árbol, preferiblemente en verano. Luego se transporta al aserradero exclusivamente mediante vagones de tren.",
          "La tala realiza el hervido de troncos para retirar la corteza, preferiblemente en primavera. Luego se transporta al aserradero por medio de tuberías."
        ]
      },
      {
        question: "7. ¿Cómo se procesan los troncos en el aserradero y qué métodos de secado existen?",
        options: [
          "Los troncos se descortezan y cortan en tablas. Se secan de forma natural al aire, o artificial por inmersión, vacío, vaporización o método mixto.",
          "Los troncos se trituran directamente en virutas. Se secan de forma mecánica con fuego directo o por congelación extrema en túneles aislados.",
          "Los troncos se prensan con cola en bloques masivos. Se secan de forma química mediante ácidos concentrados o por sumersión en aceite de petróleo."
        ]
      },
      {
        question: "8. ¿Qué diferencia a los tableros aglomerados de los tableros de fibra?",
        options: [
          "Incluyen aglomerados (virutas encoladas a presión) y tableros de fibra (elementos fibrosos básicos reconstituidos en densidades media o alta).",
          "Incluyen aglomerados (láminas enteras de roble superpuestas) y tableros de fibra (listones de pino unidos por clavos galvanizados).",
          "Incluyen aglomerados (corteza de caducifolios secada al aire) y tableros de fibra (troncos macizos vaciados en su médula interior)."
        ]
      },
      {
        question: "9. ¿Cuáles son los principales formatos comerciales de la madera?",
        options: [
          "Contrachapados (láminas con fibras cruzadas), chapas delgadas laminadas, tablas rectangulares planas, listones, molduras decorativas y redondos.",
          "Bloques macizos cúbicos, cilindros de alta presión, polvo de serrín suelto, placas cerámicas de madera y tubos huecos de celulosa.",
          "Perfiles metálicos recubiertos, bobinas continuas de papel, rollos de cámbium prensado y astillas clasificadas por diámetro."
        ]
      },
      {
        question: "10. ¿Qué herramientas manuales destacan para el corte de la madera?",
        options: [
          "Destacan el serrucho tradicional, el serrucho de costilla con refuerzo metálico y la segueta de marquetería para cortes finos en contrachapado.",
          "Destacan la escofina de desbaste gruesa, el cepillo manual de carpintero y la barrena helicoidal para Perforado rápido.",
          "Destacan la lima triangular de pulir, la cinta métrica metálica de precisión y el mazo de madera para ensamble."
        ]
      },
      {
        question: "11. ¿Qué máquinas se utilizan para el corte mecánico de la madera?",
        options: [
          "Se utiliza la sierra de disco metálico dentado rotatorio accionado por motor eléctrico y la sierra de cinta de hoja flexible con corte continuo.",
          "Se utiliza el torno de mecanizado por fricción calorífica y la taladradora de columna con brocas de diamante sintético.",
          "Se utiliza la fresadora de filo único constante y la cepilladora hidráulica de compresión neumática."
        ]
      },
      {
        question: "12. ¿Cómo se realiza el perforado de la madera para evitar fisuras?",
        options: [
          "Se realiza con la barrena manual para evitar fisuras, o con taladradoras de columna y manuales mediante movimientos de rotación y avance de la broca.",
          "Se realiza con la segueta de marquetería para evitar fisuras, o mediante sierras de disco metálico de alta velocidad.",
          "Se realiza con la escofina desgastadora para evitar fisuras, o mediante golpes directos de martillo con clavos de acero."
        ]
      },
      {
        question: "13. ¿Qué herramientas se emplean para desgastar y alisar la madera, y cómo se unen sus piezas?",
        options: [
          "Limas y escofinas desgastan la madera, el papel de lija deja superficies lisas. Las piezas se unen por pegado, clavado o atornillado desmontable.",
          "Serruchos de costilla desgastan la madera, la barrena deja superficies lisas. Las piezas se unen por fusión térmica o soldadura por arco.",
          "Sierras de cinta desgastan la madera, el cámbium deja superficies lisas. Las piezas se unen por congelado o prensado en seco."
        ]
      },
      {
        question: "14. ¿En qué consisten las operaciones de cepillado, fresado y torneado?",
        options: [
          "El cepillado arranca viruta para alisar. El fresado usa una herramienta rotativa de varios filos. El torneado mecaniza piezas haciéndolas girar.",
          "El cepillado perfora orificios rectos. El fresado une tablas mediante pegamento sintético. El torneado corta el tronco por la raíz.",
          "El cepillado prensa las fibras de celulosa. El fresado mide la densidad en kg/m³. El torneado extrae el duramen y la corteza externa."
        ]
      },
      {
        question: "15. ¿Qué función cumple la lignina en la estructura celular del árbol?",
        options: [
          "Los árboles forman anillos concéntricos por el crecimiento de biomasa de celulosa unida con lignina.",
          "La lignina actúa transportando la savia vegetal desde las raíces hasta las hojas más altas.",
          "La lignina sirve exclusivamente para almacenar agua e impedir la desecación en época de sequía."
        ]
      },
      {
        question: "16. ¿En qué época del año es preferible realizar el apeo de los árboles?",
        options: [
          "La tala realiza el apeo cortando ramas y raíces, preferiblemente en otoño o invierno.",
          "La tala realiza el apeo cortando ramas y raíces, preferiblemente en primavera o verano.",
          "La tala realiza el apeo cortando ramas y raíces, únicamente durante los meses de canícula."
        ]
      },
      {
        question: "17. ¿Qué función cumple el cámbium dentro del tronco?",
        options: [
          "El tronco consta de corteza externa, cámbium, albura (por donde viaja la savia), duramen en el centro y médula o núcleo vegetal.",
          "El cámbium es la capa más externa que protege al árbol del ataque directo de insectos y fuego.",
          "El cámbium es el núcleo vegetal central caracterizado por poseer una alta resistencia mecánica."
        ]
      },
      {
        question: "18. ¿Qué características distinguen a los tableros contrachapados?",
        options: [
          "Contrachapados (láminas con fibras cruzadas)",
          "Contrachapados (virutas prensadas con resinas sintéticas)",
          "Contrachapados (elementos fibrosos de alta densidad)"
        ]
      },
      {
        question: "19. ¿Para qué tipo de cortes se utiliza la segueta de marquetería?",
        options: [
          "la segueta de marquetería para cortes finos en contrachapado.",
          "la segueta de marquetería para taladrar la médula vegetal.",
          "la segueta de marquetería para descortezar troncos macizos."
        ]
      },
      {
        question: "20. ¿Qué movimiento caracteriza al mecanizado de piezas en el torno?",
        options: [
          "El torneado mecaniza piezas haciéndolas girar.",
          "El torneado mecaniza piezas aplicando aire a presión.",
          "El torneado mecaniza piezas mediante golpes verticales."
        ]
      }
    ];

    let currentCorrectAnswers = {};

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      const newArray = [...array];
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
      }
      return newArray;
    }

    function shuffleQuiz() {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';
      currentCorrectAnswers = {};

      for(let i=1; i<=20; i++) {
        document.getElementById(`cell-${i}`).innerText = '';
      }
      document.getElementById('result-msg').style.display = 'none';

      const shuffledQuestions = shuffle(questionsData);
      const optionLetters = ['a', 'b', 'c'];

      shuffledQuestions.forEach((qItem, qIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        const cleanQuestionText = qItem.question.replace(/^\d+\.\s*/, '');
        const qNum = qIndex + 1;
        qTitle.innerText = `${qNum}. ${cleanQuestionText}`;
        questionCard.appendChild(qTitle);

        const correctText = qItem.options[0];
        const shuffledOptions = shuffle(qItem.options);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        shuffledOptions.forEach((optText, optIndex) => {
          const letter = optionLetters[optIndex];
          
          if (optText === correctText) {
            currentCorrectAnswers[qNum] = letter;
          }

          const optLi = document.createElement('li');
          optLi.className = 'option-item';

          const inputRadio = document.createElement('input');
          inputRadio.type = 'radio';
          inputRadio.name = `question_${qNum}`;
          inputRadio.id = `q_${qNum}_opt_${optIndex}`;
          inputRadio.value = letter;

          inputRadio.addEventListener('change', () => {
            document.getElementById(`cell-${qNum}`).innerText = letter.toUpperCase();
          });

          const label = document.createElement('label');
          label.className = 'option-label';
          label.htmlFor = `q_${qNum}_opt_${optIndex}`;
          label.innerText = `${letter}) ${optText}`;

          optLi.appendChild(inputRadio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        questionCard.appendChild(optionsList);
        quizContainer.appendChild(questionCard);
      });
    }

    function checkAnswers() {
      let correctCount = 0;
      let totalQuestions = 20;

      for (let i = 1; i <= 20; i++) {
        const selectedOption = document.querySelector(`input[name="question_${i}"]:checked`);
        if (selectedOption && selectedOption.value === currentCorrectAnswers[i]) {
          correctCount++;
        }
      }

      const score = ((correctCount / totalQuestions) * 10).toFixed(1);

      const msgDiv = document.getElementById('result-msg');
      msgDiv.style.display = 'block';
      msgDiv.style.backgroundColor = score >= 5 ? '#dcfce7' : '#fee2e2';
      msgDiv.style.color = score >= 5 ? '#15803d' : '#b91c1c';
      msgDiv.style.border = `1px solid ${score >= 5 ? '#86efac' : '#fca5a5'}`;
      msgDiv.innerText = `Resultado del Test: Has acertado ${correctCount} de ${totalQuestions} preguntas (Nota: ${score} / 10).`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      shuffleQuiz();
    });
  </script>
</body>
</html>
