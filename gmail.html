<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Correo</title>
  <!-- Servicio de envío EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f0f4f8;
      --text: #2d3748;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    header {
      text-align: center;
      background: var(--primary);
      color: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 1.1rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border: 2px solid #cbd5e0;
      border-radius: 12px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: none;
      height: 100px;
    }

    .emoji-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .emoji-btn {
      font-size: 1.5rem;
      background: #edf2f7;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .btn-send {
      width: 100%;
      background: #2ed573;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);
    }

    .btn-send:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📧 Correo de Clase</h1>
    </header>

    <!-- Quién envía -->
    <div class="form-group">
      <label for="student">¿Quién eres?</label>
      <select id="student">
        <option value="">-- Selecciona tu nombre --</option>
        <option value="Alba">Alba</option>
        <option value="Rocio">Rocio</option>
        <option value="Aitana">Aitana</option>
        <option value="Marta">Marta</option>
      </select>
    </div>

    <!-- Código de la alumna -->
    <div class="form-group">
      <label for="passcode">Tu código secreto:</label>
      <input type="number" id="passcode" placeholder="Escribe tu número" autocomplete="off">
    </div>

    <!-- Destinatario fijo (solo lectura) -->
    <div class="form-group">
      <label>Para:</label>
      <input type="text" value="etorjap986@g.educaand.es" disabled style="background: #e2e8f0; font-weight: bold;">
    </div>

    <!-- Asunto -->
    <div class="form-group">
      <label for="subject">Asunto:</label>
      <input type="text" id="subject" placeholder="Ej: Hola profe, Mi dibujo..." autocomplete="off">
    </div>

    <!-- Mensaje -->
    <div class="form-group">
      <label for="message">Mensaje:</label>
      <textarea id="message" placeholder="Escribe aquí tu mensaje..."></textarea>
    </div>

    <!-- Emojis rápidos -->
    <div class="emoji-bar">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('⭐')">⭐</button>
      <button class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
      <button class="emoji-btn" onclick="addEmoji('👋')">👋</button>
    </div>

    <button class="btn-send" onclick="enviarCorreo()">Enviar Mensaje 🚀</button>
  </div>

  <script>
    // Configuración de las alumnas y sus códigos
    const credenciales = {
      "Alba": "1",
      "Rocio": "2",
      "Aitana": "3",
      "Marta": "4"
    };

    // 🔴 REEMPLAZA ESTE VALOR CON TU PUBLIC KEY DE EMAILJS
    const PUBLIC_KEY_EMAILJS = "TU_PUBLIC_KEY";

    if (typeof emailjs !== "undefined") {
      emailjs.init(PUBLIC_KEY_EMAILJS);
    }

    function addEmoji(emoji) {
      const msgArea = document.getElementById('message');
      msgArea.value += emoji;
      msgArea.focus();
    }

    function enviarCorreo() {
      const alumna = document.getElementById('student').value;
      const codigo = document.getElementById('passcode').value.trim();
      const asunto = document.getElementById('subject').value.trim() || "(Sin asunto)";
      const texto = document.getElementById('message').value.trim();

      // Validación 1: Selección de alumna
      if (!alumna) {
        alert("⚠️ Por favor, selecciona tu nombre.");
        return;
      }

      // Validación 2: Código numérico correcto
      if (credenciales[alumna] !== codigo) {
        alert("❌ El código secreto no es correcto. ¡Revisa tu número!");
        return;
      }

      // Validación 3: Texto del mensaje
      if (!texto) {
        alert("⚠️ Escribe un mensaje antes de enviar.");
        return;
      }

      // Parámetros que se envían por correo a tu dirección de Educaand
      const templateParams = {
        to_email: "etorjap986@g.educaand.es",
        from_name: alumna,
        subject: asunto,
        message: texto
      };

      // Envío del correo
      // 🔴 REEMPLAZA "TU_SERVICE_ID" Y "TU_TEMPLATE_ID" POR LOS TUYOS
      emailjs.send("TU_SERVICE_ID", "TU_TEMPLATE_ID", templateParams)
        .then(function() {
          alert("¡Genial! 🚀 Tu mensaje ha sido enviado al profesor.");
          document.getElementById('subject').value = '';
          document.getElementById('message').value = '';
          document.getElementById('passcode').value = '';
        }, function(error) {
          alert("Error al enviar el mensaje. Inténtalo de nuevo.");
          console.error("EmailJS Error:", error);
        });
    }
  </script>
</body>
</html>
